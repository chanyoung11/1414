<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#131412">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="콘티">

<title>콘티 — 찬양팀 인계 도구 v0.5</title>
<style>
:root{
  --bg:#131412;--bg2:#1A1B18;--panel:#212220;--panel2:#2B2C28;--panel3:#353732;
  --line:#2E302B;--line2:#43453F;
  --ink:#EEEFE8;--mute:#A3A69C;--faint:#80837A;
  --amber:#E9C35C;--amberink:#1D1500;--amber-soft:rgba(233,195,92,.16);
  --teal:#86CDBD;--tealink:#0F3F37;--teal-soft:rgba(134,205,189,.16);
  --red:#E4816F;--yel:#FFE58A;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
svg.ic{width:20px;height:20px;flex:0 0 auto;display:block}
#app{height:100%;display:flex;flex-direction:column;color:var(--ink)}
/* header */
.top{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;min-height:48px}
.top h1{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:18px}
.brand small{font-weight:400;color:var(--mute);font-size:13px;margin-left:8px;letter-spacing:0}
.titlein{background:transparent;border:0;outline:none;font-weight:700;font-size:16px;letter-spacing:-.01em;width:100%;min-width:0;padding:4px 0;border-bottom:1px solid transparent}
.titlein:focus{border-bottom-color:var(--amber)}
.titlein.big{font-size:19px}
.titlein::placeholder{color:var(--faint);font-weight:500}
.titlewrap{display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:text}
.titlewrap .titlein{flex:1;min-width:0}
.penic{color:var(--faint);display:inline-flex;flex:0 0 auto}
.penic svg.ic{width:15px;height:15px}
.titlewrap:focus-within .penic{color:var(--amber)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:0 12px;height:34px;background:var(--panel2);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap;line-height:1}
.btn svg.ic{width:16px;height:16px}
.btn.pri{background:var(--amber);color:var(--amberink);font-weight:700}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--red)}
.btn.outline{background:transparent;border:1px solid var(--line2)}
.btn:disabled{opacity:.35;cursor:default}
.icon{width:34px;height:34px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:0 0 auto}
.icon.sm{width:28px;height:28px}
.icon.sm svg.ic{width:15px;height:15px}
.icon.ghost{background:transparent;color:var(--mute)}
.icon:disabled{opacity:.3}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 9px;height:26px;font-size:12px;margin:2px 3px 2px 0;background:var(--panel2);color:var(--ink);white-space:nowrap;line-height:1;font-weight:500}
.chip.s{background:var(--amber-soft);color:var(--amber)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.dim{color:var(--faint)}
.chip.mod{background:var(--teal-soft);color:var(--teal)}
.chip.x{border:1px dashed var(--line2);background:transparent;color:var(--mute)}
.chip.t{height:22px;font-size:11px;padding:0 8px}
.seg{display:inline-flex;background:var(--panel2);border-radius:9px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--panel3);color:var(--ink)}
.seg button svg.ic{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 8px;height:22px;font-size:11.5px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.amber{background:var(--amber-soft);color:var(--amber);font-weight:700}
.pill.key{background:var(--amber);color:var(--amberink);font-weight:800;font-size:12px;height:24px;padding:0 9px}
/* fields */
.lbl{font-size:11.5px;color:var(--mute);margin:12px 0 5px;font-weight:600}
.lbl .hint{font-weight:400}
.field{width:100%;border:0;border-radius:8px;padding:8px 10px;background:var(--panel2);outline:none;color:var(--ink)}
.field::placeholder{color:var(--faint)}
.field:focus{box-shadow:0 0 0 1.5px var(--amber)}
textarea.field{resize:vertical;min-height:56px;line-height:1.45}
.pillin{background:var(--panel2);border:0;border-radius:999px;height:30px;padding:0 10px;width:74px;text-align:center;font-weight:700;outline:none}
.pillin:focus{box-shadow:0 0 0 1.5px var(--amber)}
.pillin::placeholder{color:var(--faint);font-weight:500}
.fbox{border:1px solid var(--line2);border-radius:9px;padding:8px;background:var(--bg2)}
.hr{height:1px;background:var(--line2);margin:2px 0 4px}
.ytc{color:#FF3D3D}.icon.ytc{background:rgba(255,61,61,.14)}
.micc{color:var(--teal)}.icon.micc{background:var(--teal-soft)}
.chip.on .ytc,.chip.on .micc{color:inherit}
.songbar{width:100%;display:block;background:var(--amber);color:var(--amberink);border:0;border-radius:7px;padding:7px 10px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;font-weight:600;outline:none;line-height:1.4;white-space:pre-wrap;word-break:break-word}
textarea.songbar{resize:none;overflow:hidden;min-height:34px}
.songbar::placeholder{color:rgba(29,21,0,.45);font-weight:500}
.songbar:focus{box-shadow:0 0 0 2px rgba(233,195,92,.5)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;width:100%;margin:0 auto;padding:18px 18px 60px}
.card{background:var(--panel2);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--mute)}
.small{font-size:13px}
.hint{font-size:12px;color:var(--faint)}
.sec{margin-top:18px}
/* markers */
.mk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);font-size:12px;font-weight:700;flex:0 0 auto;line-height:1}
.mk.now{border-color:var(--amber);color:var(--amber)}
.tag{font-size:11px;padding:2px 6px;border-radius:5px;background:var(--teal-soft);color:var(--teal);white-space:nowrap;font-weight:600}
.tag.me{background:var(--panel3);color:var(--mute)}
.num{width:22px;height:22px;border-radius:50%;background:var(--panel3);color:var(--mute);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
/* lists */
.list-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;position:relative}
.list-item.sel{background:var(--panel2)}
.list-item.sel::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--amber)}
.list-item .k{color:var(--mute);font-size:13px;font-weight:600}
.grip{color:var(--faint);cursor:grab;touch-action:none;display:inline-flex;padding:4px 2px;margin-left:-4px}
.grip svg.ic{width:14px;height:14px}
.list-item.dragging{background:var(--panel3);opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.list-item.dragging .grip{cursor:grabbing}
.svcrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--panel2);margin-bottom:8px;cursor:pointer}
.svcrow.past{opacity:.55}
.svcrow .date{width:56px;text-align:center;flex:0 0 auto}
.svcrow .date b{display:block;font-size:17px;letter-spacing:-.02em;line-height:1.1}
.svcrow .date span{font-size:12px;color:var(--mute)}
.svcrow .t{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.svcrow .s{color:var(--mute);font-size:13px;margin-top:2px}
/* workspace (Premiere-style panels) */
.ws{flex:1;min-height:0;display:grid;gap:6px;padding:6px;background:var(--bg)}
.ws.split{grid-template-columns:var(--lw,44%) 6px minmax(0,1fr)}
.stack{display:grid;grid-template-rows:fit-content(50%) 6px minmax(0,1fr);gap:0;min-height:0;min-width:0}
.vgutter{cursor:row-resize;touch-action:none;position:relative;z-index:2}
.vgutter::before{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.vgutter::after{content:"";position:absolute;top:2px;left:50%;height:2px;width:36px;margin-left:-18px;border-radius:1px;background:var(--line2)}
.vgutter:hover::after,.vgutter.drag::after{background:var(--amber)}
.gutter{border-radius:4px;cursor:col-resize;touch-action:none;position:relative}
.gutter::before{content:"";position:absolute;top:0;bottom:0;left:-8px;right:-8px}
.gutter::after{content:"";position:absolute;left:3px;top:50%;width:2px;height:36px;margin-top:-18px;border-radius:1px;background:var(--line2)}
.gutter:hover::after,.gutter.drag::after{background:var(--amber)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ptab{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 0;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto}
.ptab .tab{height:32px;display:inline-flex;align-items:center;padding:0 12px;font-size:12px;font-weight:700;color:var(--ink);position:relative;background:var(--panel);border-right:1px solid var(--line)}
.ptab .tab::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--amber)}
.ptab .sub{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pbody{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.pfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--line);font-size:13px;background:var(--bg2)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;min-height:52px}
.bar b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:16px;letter-spacing:-.01em}
/* sheet (always paper) */
.sheetwrap{flex:1;min-height:0;overflow:auto;background:var(--bg);-webkit-overflow-scrolling:touch;padding:12px}
.sheet{position:relative;background:#fff;border-radius:12px;padding:12px 12px 70px 44px;box-shadow:0 10px 40px rgba(0,0,0,.45);
 --panel:#fff;--panel2:#F2F3EE;--panel3:#E6E7E1;--ink:#1B1C19;--mute:#6D7069;--faint:#9A9D94;--line:#D6D8D0;--line2:#B9BCB2;--teal-soft:#DCEBE6;--teal:#164E47;--tealink:#164E47;--amber-soft:#FBEFC4;--amber:#8A6512;color:var(--ink)}
.sheet .mk{background:#fff;border-color:#1B1C19;color:#1B1C19}
.sheet .mk.now{border-color:#1F6B62;color:#1F6B62}
.piece{position:relative;margin-bottom:16px}
.piece .phead{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;margin:0 0 6px -32px}
.piece .phead span.ln{flex:1;height:1px;background:var(--line2)}
.slice{position:relative;background-repeat:no-repeat;background-color:#fff;touch-action:pan-y}
.slice.tool{cursor:crosshair}
.hltool .slice{touch-action:none}
.mkabs{position:absolute;transform:translate(-50%,-50%);z-index:3}
.mkabs::before,.strip .mk::before,.addm::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.strip .mk,.addm{position:relative}
.mkabs .badge{position:absolute;right:-9px;top:-7px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;line-height:15px}
.hl{position:absolute;background:var(--yel);opacity:.55;border-radius:3px;pointer-events:none}
.slice.tool .hl[data-hl]{pointer-events:auto;cursor:pointer}
.cutline{position:absolute;left:-36px;right:0;border-top:1.5px dashed #1F6B62;pointer-events:auto;cursor:row-resize;touch-action:none;z-index:4}
.cutline::before{content:"";position:absolute;left:0;right:0;top:-12px;bottom:-12px}
.cutline i{position:absolute;right:6px;top:-9px;width:16px;height:16px;border-radius:4px;background:#1F6B62}
.cutline b{position:absolute;right:26px;top:-9px;font-size:10px;line-height:16px;color:#1F6B62;font-weight:700}
.cutline.drag{border-top-style:solid;border-top-color:var(--amber)}
.cutline.drag i{background:var(--amber)}
.strip{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 0;margin:2px 0 2px -34px;position:relative;min-height:32px;flex-wrap:nowrap;overflow-x:auto}
.strip .mk{margin-right:2px}
.strip .modl{font-size:12px;color:#1F6B62;font-weight:700;white-space:nowrap}
.m{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;font-size:12.5px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;background:#fff;flex:0 0 auto;color:#1B1C19}
.m .who{font-size:10px;padding:1px 4px;border-radius:3px;background:rgba(0,0,0,.06);color:#6D7069}
.m.leader{background:#DCEBE6;color:#164E47}
.m.leader .who{background:rgba(255,255,255,.75);color:#164E47}
.m.session{border:1px solid #B9BCB2}
.m.mine{border:1.5px dashed #B9BCB2;color:#6D7069}
.m.extra{display:none}
.strip.open .m.extra{display:inline-flex}
.strip.open .more{display:none}
.strip .more{height:26px;font-size:12px;background:#F2F3EE;color:#6D7069;border-radius:999px;padding:0 9px;display:inline-flex;align-items:center}
.addm{width:28px;height:28px;border-radius:50%;border:1px dashed #B9BCB2;background:transparent;color:#6D7069;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.addm svg.ic{width:14px;height:14px}
/* stage */
.stage .media{display:none!important}
.stage .stack,.stage .gutter,.stage .top{display:none!important}
.stage .ws{padding:0;gap:0}
.stage .panel{border:0;border-radius:0}
.sbtn{width:28px;height:28px;border-radius:7px;background:rgba(0,0,0,.14);color:inherit;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.sbtn:disabled{opacity:.3}
.sbtn svg.ic{width:16px;height:16px}
.stage .ws.split{grid-template-columns:minmax(0,1fr)}
.stage #sheetpanel .ptab{display:none}
.stage .stagebar{display:flex}
.stagebar{display:none;align-items:center;gap:14px;padding:6px 12px;background:var(--amber);color:var(--amberink);font-size:12.5px;white-space:nowrap;overflow-x:auto;flex:0 0 auto}
.stagetitle{font-weight:800;flex:0 0 auto}
.stageform{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:600}
.stagenote{opacity:.75;flex:0 0 auto}
.songnav{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.nb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nb.prev,.nb.next{color:var(--faint);font-size:12.5px;flex:0 1 22%;cursor:pointer}
.nb.prev{text-align:right}
.nb.cur{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;flex:0 1 auto;max-width:52%}
.nb.cur .num{flex:0 0 auto}
.stage .stack{grid-template-rows:minmax(0,1fr)!important}
.stage .vgutter{display:none}
.stage .filters{display:none!important}
.stage .sheetwrap{padding:6px}
.stage .sheet{border-radius:8px;filter:brightness(.92);max-width:1000px;margin:0 auto}
/* media */
.media{flex:0 0 auto}
.vid{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-height:36vh}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .fb{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px;gap:8px}
.now{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel2)}
.now .art{width:48px;height:48px;border-radius:10px;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wave i{display:block;width:3px;border-radius:1px;background:var(--faint)}
.transport{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 2px}
.tbtn{width:40px;height:40px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.tbtn.pri{width:50px;height:50px;background:var(--amber);color:var(--amberink)}
.tbtn.pri svg.ic{width:22px;height:22px}
.prog{flex:1;height:5px;background:var(--panel3);border-radius:3px;position:relative;cursor:pointer}
.prog .fill{position:absolute;left:0;top:0;height:5px;background:var(--amber);border-radius:3px}
.prog .tick{position:absolute;top:-4px;width:2px;height:13px;background:var(--mute);border-radius:1px}
.tl{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.tl.now{background:var(--panel2)}
.tl .t{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--amber);min-width:40px;font-weight:600}
.thumb{width:96px;height:66px;border-radius:9px;background-size:cover;background-position:top left;flex:0 0 auto;background-color:#fff}
.lower{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch i{width:38px;height:22px;border-radius:11px;background:var(--panel3);position:relative;display:block;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on i{background:var(--amber)}
.switch.on i::after{left:19px}
/* modals */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.ov.center{align-items:center}
.sheetm{background:var(--panel);color:var(--ink);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 20px 28px}
.sheetm .handle{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.ov.center .sheetm{border-radius:18px;width:min(640px,94%)}
.q{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:0 12px;height:32px;font-size:13px;margin:0 6px 8px 0;background:transparent;color:var(--ink);font-weight:500}
.q.on{background:var(--amber);color:var(--amberink);border-color:transparent;font-weight:700}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
@media (max-width:820px){.ws.split{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto auto minmax(0,1fr)}.gutter{display:none}.stack{max-height:52vh}}

/* ---- 계정·팀 화면 ---- */
.gate{flex:1;overflow:auto;padding:24px 16px}
.gate .card{max-width:440px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 22px 24px}
.gate .card:first-child{margin-top:6vh}.gate .card+.card{margin-top:14px}
.gate .brand{display:block;margin-bottom:4px}.gate .sub{color:var(--mute);margin-bottom:10px}
.tabs{display:flex;gap:4px;background:var(--panel2);border-radius:10px;padding:3px;margin:10px 0 4px}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast"></div>
<script>
(function(){
'use strict';
/* ---------- utils ---------- */
const $=(s,r)=> (r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtT=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const parseT=str=>{const m=String(str).trim().match(/^(\d+):(\d{1,2})$/);if(m)return +m[1]*60+ +m[2];const n=parseFloat(str);return isNaN(n)?0:n};
const today=()=>new Date().toISOString().slice(0,10);
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
/* ---------- icons ---------- */
const ICONS={
 play:'<path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/>',
 pause:'<rect x="6" y="5" width="4.5" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2" fill="currentColor"/>',
 back:'<path d="M15 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
 up:'<path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
 down:'<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
 left:'<path d="M14 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
 right:'<path d="M10 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
 plus:'<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 x:'<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
 camera:'<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.2-2h5.6L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/>',
 mic:'<rect x="9" y="3.5" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5V21M9 21h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
 yt:'<rect x="3" y="6" width="18" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/>',
 music:'<path d="M9 18.5V6l10-2v12.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18.5" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16.5" r="2.5" fill="currentColor"/>',
 gear:'<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
 export:'<path d="M12 15V4M8 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 14v5h14v-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
 import:'<path d="M12 4v11M8 11l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 14v5h14v-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
 trash:'<path d="M5 7h14M9 7V4.5h6V7M8 7l.8 13h6.4L16 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>',
 moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>',
 sun:'<circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
 pen:'<path d="M4 20l4.5-1 10-10-3.5-3.5-10 10z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>',
 marker:'<circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.9"/><text x="12" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="sans-serif">A</text>',
 hl:'<rect x="4" y="8" width="16" height="8" rx="2" fill="currentColor" opacity=".55"/>',
 note:'<path d="M5 5.5A1.5 1.5 0 0 1 6.5 4h11A1.5 1.5 0 0 1 19 5.5v9l-4.5 4.5h-8A1.5 1.5 0 0 1 5 17.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M14.5 19v-4.5H19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>',
 send:'<path d="M4 12l16-8-6 16-2.5-6.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>',
 eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/>',
 list:'<path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 back5:'<path d="M11 8.5L7 12l4 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="14.5" y="15.5" font-size="9" font-weight="700" fill="currentColor" font-family="sans-serif">5</text>',
 fwd5:'<path d="M13 8.5l4 3.5-4 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="5" y="15.5" font-size="9" font-weight="700" fill="currentColor" font-family="sans-serif">5</text>',
 open:'<path d="M14 4h6v6M20 4l-9 9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 14v5H5V5h5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>'
};
const ic=(n,cls)=>`<svg class="ic ${cls||''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const fmtDate=d=>{if(!d)return {md:'—',w:''};const t=new Date(d+'T00:00:00');if(isNaN(t))return {md:d,w:''};return {md:(t.getMonth()+1)+'/'+t.getDate(),w:['일','월','화','수','목','금','토'][t.getDay()]}};

/* ---------- HOME ---------- */
/* ---------- EDITOR ---------- */
/* ---------- workspace helpers ---------- */
function ptab(name,sub,right){return `<div class="ptab"><span class="tab">${esc(name)}</span>${sub?`<span class="sub">${sub}</span>`:''}<span class="grow"></span>${right||''}</div>`}
function initGutter(onEnd){const ws=$('#ws');if(!ws)return;initVGutter(onEnd);const g=$('.gutter',ws);if(!g)return;const saved=localStorage.getItem('conti-lw');if(saved)ws.style.setProperty('--lw',saved);
 g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);g.classList.add('drag');const r=ws.getBoundingClientRect();g.onpointermove=ev=>{const w=Math.min(Math.max(ev.clientX-r.left-8,300),r.width-340);ws.style.setProperty('--lw',w+'px')};
  g.onpointerup=()=>{g.onpointermove=null;g.classList.remove('drag');try{localStorage.setItem('conti-lw',ws.style.getPropertyValue('--lw'))}catch(e){}onEnd&&onEnd()}}}

function initVGutter(onEnd){const st=$('#stack');if(!st)return;const g=$('.vgutter',st);if(!g)return;const key='conti-th-'+route().name;const saved=localStorage.getItem(key);if(saved)st.style.gridTemplateRows=saved+'px 6px minmax(0,1fr)';
 g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);g.classList.add('drag');const r=st.getBoundingClientRect();g.onpointermove=ev=>{const h=Math.min(Math.max(ev.clientY-r.top-3,80),r.height-120);st.style.gridTemplateRows=h+'px 6px minmax(0,1fr)'};
  g.onpointerup=()=>{g.onpointermove=null;g.classList.remove('drag');try{localStorage.setItem(key,parseInt(st.style.gridTemplateRows))}catch(e){}onEnd&&onEnd()}}}

/* ---------- HOME ---------- */
function homeHTML(){
 const m=me();
 return `<div class="top"><div class="brand">콘티<small>찬양팀 인계 도구 v0</small></div><span class="grow"></span>${online()?`<button class="btn sm" data-act="team">${ic('list')}${esc(S.team.name||'팀')}</button>`:''}<span class="pill">${esc(m.name||'이름 없음')} · ${esc(m.session)} · ${roleLabel(m.role)}</span><button class="icon" data-act="settings" title="설정">${ic('gear')}</button></div>
 <div class="ws" style="grid-template-columns:minmax(0,1fr);grid-template-rows:1fr ${isLeader()?'auto':''}">
  <div class="panel">${ptab('예배',S.services.length+'개',`${isLeader()?`<button class="btn sm pri" data-act="new-svc">${ic('plus')}새 예배</button>`:''}<button class="btn sm" data-act="import">${ic('import')}가져오기</button><button class="btn sm" data-act="export">${ic('export')}내보내기</button>`)}
   <div class="pbody">
   ${S.services.length?S.services.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(s=>{const d=fmtDate(s.date);const past=(s.date||'')<today();return `<div class="svcrow ${past?'past':''}" data-act="open-svc" data-id="${s.id}"><div class="date"><b>${esc(d.md)}</b><span>${esc(d.w)}</span></div><div class="grow"><div class="t">${esc(s.name||'(이름 없음)')}</div><div class="s">${s.items.length}곡 · ${s.published?'v'+s.published.version+' 발행됨':'미발행'}${s.published&&s.version>s.published.version?' · 수정 중':''}</div></div>
    <div class="row">${isLeader()?`<button class="btn sm" data-act="edit-svc" data-id="${s.id}">${ic('pen')}편집</button>`:''}<button class="btn sm" data-act="view-svc" data-id="${s.id}">${ic('eye')}콘티</button>${isLeader()?`<button class="icon sm ghost" data-act="del-svc" data-id="${s.id}" title="삭제">${ic('trash')}</button>`:''}</div></div>`}).join('')
   :`<div class="empty">아직 예배가 없어요.<br><span class="hint">${isLeader()?'"새 예배"로 시작하거나, 인도자가 보낸 파일을 가져오세요.':'인도자가 보낸 파일을 "가져오기"로 여세요.'}</span></div>`}
   <p class="hint" style="margin-top:20px">${online()?`${esc(S.team.name)} 팀 계정으로 로그인되어 있어요. 콘티 파일 동기화는 다음 단계라 아직은 "내보내기" 파일을 카톡으로 보내고, 멤버는 "가져오기"로 엽니다.`:'이 기기에만 저장됩니다. 팀에 보내려면 "내보내기" 파일을 카톡으로 보내고, 멤버는 "가져오기"로 엽니다. 서버 연동은 다음 단계.'}</p>
   </div></div>
  ${isLeader()?`<div class="panel">${ptab('라이브러리',S.library.length+'곡 · 예배에 넣은 곡은 자동 저장')}<div class="pbody" style="max-height:160px">${S.library.length?S.library.map(s=>`<span class="chip">${ic('music')}${esc(s.title)} <span class="muted">${esc(keyStr(s))}</span></span>`).join(''):'<span class="hint">비어 있음</span>'}</div></div>`:''}
 </div>`;
}

/* ---------- EDITOR ---------- */
function editorHTML(svc){
 const sel=SEL[svc.id]||(SEL[svc.id]={item:svc.items[0]&&svc.items[0].id,tool:'marker'});
 const it=svc.items.find(i=>i.id===sel.item)||svc.items[0];if(it)sel.item=it.id;
 const status=svc.published?'v'+svc.published.version+(svc.version>svc.published.version?' · 수정 중':''):'초안';
 return `<div class="top"><button class="icon ghost" data-act="home" title="홈">${ic('back')}</button><h1><label class="titlewrap"><input class="titlein" data-f="svc.name" placeholder="예배 이름 (예: 11/21 LIKE MT 저녁집회)" value="${esc(svc.name)}"><span class="penic">${ic('pen')}</span></label><span class="pill">${esc(status)}</span></h1>
  <button class="btn ghost" data-act="view-svc" data-id="${svc.id}">${ic('eye')}미리보기</button><button class="btn pri" data-act="publish">${ic('send')}발행</button></div>
 <div class="ws split" id="ws">
  <div class="stack ed" id="stack">
   <div class="panel">${ptab('예배','날짜 · 공지 · 곡 순서',`<button class="btn sm" data-act="add-lib">${ic('music')}라이브러리</button><button class="btn sm pri" data-act="add-item">${ic('plus')}새 곡</button>`)}
    <div class="pbody">
     <div class="row" style="gap:10px"><input class="field" type="date" data-f="svc.date" value="${esc(svc.date)}" style="width:150px"><textarea class="field grow" data-f="svc.notice" rows="1" placeholder="전체 공지 — 연습 일정, 편성, 집합 장소">${esc(svc.notice)}</textarea></div>
     <div style="margin-top:10px">${svc.items.map((x,i)=>`<div class="list-item ${x.id===sel.item?'sel':''}" data-act="sel-item" data-id="${x.id}"><span class="grip" title="끌어서 순서 바꾸기">${ic('list')}</span><span class="num">${i+1}</span><span class="grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600">${esc(x.title||'(제목 없음)')}</span><span class="k">${esc(keyStr(x))}</span><button class="icon sm ghost" data-act="mv-item" data-id="${x.id}" data-d="-1" title="위로">${ic('up')}</button><button class="icon sm ghost" data-act="mv-item" data-id="${x.id}" data-d="1" title="아래로">${ic('down')}</button></div>`).join('')||'<div class="empty" style="padding:14px">곡을 추가하세요</div>'}</div>
    </div></div>
   <div class="vgutter" title="드래그해서 높이 조절"></div>
   <div class="panel">${ptab('곡 편집',it?esc(it.title||'(제목 없음)'):'')}
    <div class="pbody">${it?itemEditorHTML(svc,it):'<div class="empty">위에서 곡을 선택하거나 추가하세요</div>'}</div></div>
  </div>
  <div class="gutter" title="드래그해서 폭 조절"></div>
  <div class="panel">${ptab('악보',it?'':'',`<div class="seg"><button class="${sel.tool==='marker'?'on':''}" data-act="tool" data-t="marker">${ic('marker')}마커</button><button class="${sel.tool==='hl'?'on':''}" data-act="tool" data-t="hl">${ic('hl')}하이라이트</button><button class="${sel.tool==='memo'?'on':''}" data-act="tool" data-t="memo">${ic('note')}메모</button></div>${it?`<label class="btn sm" for="pieceFile">${ic('camera')}조각 추가</label><input id="pieceFile" type="file" accept="image/*" multiple style="display:none">`:''}`)}
   <div class="sheetwrap" id="sheetwrap"><div class="sheet" id="sheet">${it?'':'<div class="empty">왼쪽에서 곡을 추가하세요</div>'}</div></div>
   ${it&&it.pieces.length?`<div class="pfoot">${it.pieces.map((p,i)=>`<span class="chip t">조각 ${i+1}<button class="icon sm ghost" data-act="mv-piece" data-id="${p.id}" data-d="-1">${ic('left')}</button><button class="icon sm ghost" data-act="mv-piece" data-id="${p.id}" data-d="1">${ic('right')}</button><button class="icon sm ghost" data-act="del-piece" data-id="${p.id}">${ic('x')}</button></span>`).join('')}<span class="hint">${sel.tool==='marker'?'악보를 탭하면 마커 · 마커를 탭하면 절단선·삭제':sel.tool==='hl'?'드래그해서 노란 사각형 · 탭하면 삭제':'마커를 탭하면 인도자 메모'}</span></div>`:''}
  </div>
 </div>`;
}
function itemEditorHTML(svc,it){
 return `<div>
  <div class="row" style="gap:10px"><label class="titlewrap grow"><input class="titlein big" data-f="item.title" placeholder="곡 제목" value="${esc(it.title)}"><span class="penic">${ic('pen')}</span></label><button class="icon sm ghost" data-act="del-item" data-id="${it.id}" title="콘티에서 빼기">${ic('trash')}</button></div>
  <div class="row" style="margin-top:10px;gap:8px"><input class="pillin" data-f="item.key" placeholder="키" value="${esc(it.key)}"><span class="muted">–</span><input class="pillin" data-f="item.mod" placeholder="전조" value="${esc(it.mod||'')}"><span class="hint">곡 안에서 전조하면 전조 키에 (예: G – A)</span></div>
  <div class="lbl">송폼 <span class="hint">지금 쓰는 표기 그대로 한 줄</span></div>
  <div class="fbox"><textarea class="songbar" data-f="item.form" rows="1" placeholder="멘트 – A1 – (Full)Int(4) – A1B – Int(2) – (Down)A3B – Outro(4)">${esc(it.form)}</textarea>
  <div id="formchips" style="margin-top:8px;min-height:22px">${chipsHTML(it.form,'t')}</div></div>
  <div class="lbl">미디어 <span class="hint">유튜브 링크 또는 녹음 파일</span></div>
  ${it.media.map(md=>`<div style="padding:8px 0 4px;border-bottom:1px solid var(--line2)"><div class="row"><span class="icon sm ${md.type==='youtube'?'ytc':'micc'}">${ic(md.type==='youtube'?'yt':'mic')}</span><span class="grow small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(md.name||md.url)}</span>${md.type==='youtube'?`<a class="btn sm ghost" href="https://youtu.be/${ytId(md.url)}" target="_blank" rel="noopener">${ic('open')}열기</a>`:''}<button class="icon sm ghost" data-act="del-media" data-id="${md.id}">${ic('x')}</button></div>
   ${md.type==='youtube'?`<div class="row small" style="margin:6px 0 0 8px;gap:6px"><span class="hint">구간</span><input class="field mono" data-md="start" data-id="${md.id}" value="${md.start?fmtT(md.start):''}" placeholder="시작 0:00" style="width:88px;text-align:center"><span class="hint">–</span><input class="field mono" data-md="end" data-id="${md.id}" value="${md.end?fmtT(md.end):''}" placeholder="끝" style="width:88px;text-align:center"><span class="hint">풀 예배 영상에서 이 곡만 잘라 쓸 때</span></div>`:''}

/* ---------- IndexedDB ---------- */
const IDB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('conti-v1',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};r.onsuccess=e=>{IDB.db=e.target.result;res()};r.onerror=()=>rej(r.error)})},
 tx(store,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,mode);const s=t.objectStore(store);const q=fn(s);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 get(store,k){return IDB.tx(store,'readonly',s=>s.get(k))},
 put(store,k,v){return IDB.tx(store,'readwrite',s=>s.put(v,k))},
 del(store,k){return IDB.tx(store,'readwrite',s=>s.delete(k))}
};
const urlCache=new Map();
async function blobURL(id){if(!id)return '';if(urlCache.has(id))return urlCache.get(id);const b=await IDB.get('blobs',id);if(!b)return '';const u=URL.createObjectURL(b);urlCache.set(id,u);return u}
const url=id=>urlCache.get(id)||'';

/* ---------- song form parser ---------- */
function parseForm(str){
 const out=[];if(!str)return out;
 const segs=str.split(/\s+[–\-—]\s+|\s*–\s*/).map(s=>s.trim()).filter(Boolean);
 const FLOW=['멘트','1414','다음 곡','다음곡','rit.','rit','반복','Brk','브레이크'];
 for(const seg of segs){
  let i=0;const toks=[];
  while(i<seg.length){
   const rest=seg.slice(i);
   let m;
   if(rest[0]==='('){ // balanced paren
    let d=0,j=0;for(;j<rest.length;j++){if(rest[j]==='(')d++;else if(rest[j]===')'){d--;if(d===0)break}}
    const inner=rest.slice(1,j);i+=j+1;
    if(/^(full|down|key ?up|key ?down|brk|break|soft|loud|half)/i.test(inner))toks.push({t:'mod',v:inner});
    else toks.push({t:'part',v:inner});continue}
   if((m=rest.match(/^(Intro|Int|Outro|Inter|Bridge|Ending|Tag)\s*(\((?:[^()]|\([^()]*\))*\))?/i))){let v=m[1];if(m[2]){let x=m[2].slice(1,-1);v+=' '+x.replace(/\((.*)\)/,' · $1')}toks.push({t:'part',v});i+=m[0].length;continue}
   if((m=rest.match(/^(다음 ?곡|멘트|1414|rit\.?|반복)/))){toks.push({t:'flow',v:m[1].replace('다음곡','다음 곡')});i+=m[0].length;continue}
   if((m=rest.match(/^([A-Ha-h])(\d?)(['’]?)/))){toks.push({t:'sec',v:m[1].toUpperCase()+m[2]+(m[3]?"'":'')});i+=m[0].length;continue}
   if((m=rest.match(/^[\s,·]+/))){i+=m[0].length;continue}
   // unknown run
   m=rest.match(/^[^A-Ha-h(\s]+/)||rest.match(/^./);toks.push({t:'etc',v:m[0]});i+=m[0].length;
  }
  out.push(...toks);
 }
 return out;
}
function chipsHTML(str,cls){return parseForm(str).map(t=>`<span class="chip ${t.t==='sec'?'s':t.t==='mod'?'mod':t.t==='etc'?'x':''} ${cls||''}">${esc(t.v)}</span>`).join('')}
function modsFor(str){const toks=parseForm(str),map={};let pending=[];for(const t of toks){if(t.t==='mod'){pending.push(t.v);continue}if(t.t==='sec'){const base=t.v.replace(/\d+/g,'');if(pending.length){if(!map[t.v])map[t.v]=pending.join(' · ');if(!map[base])map[base]=pending.join(' · ')+(t.v!==base?' ('+t.v+')':'')}pending=[];continue}if(t.t!=='flow')pending=[]}return map}

/* ---------- image import + gap detection ---------- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function importImage(file){
 const src=URL.createObjectURL(file);const im=await loadImg(src);
 const maxW=1400,s=Math.min(1,maxW/im.naturalWidth);let w=Math.round(im.naturalWidth*s),h=Math.round(im.naturalHeight*s);
 let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);
 const info=analyze(c);
 if(info.photo){c=flatten(c,info)}                       // 명암 정리 (그림자·회색 배경 → 흰 배경)
 if(Math.abs(info.angle)>=0.3){c=rotateCanvas(c,-info.angle)} // 기울기 보정
 const box=inkBox(c);if(box){c=cropCanvas(c,box)}         // 여백 잘라내기
 w=c.width;h=c.height;
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
 const gaps=detectGaps(c);URL.revokeObjectURL(src);
 return {blob,w,h,gaps,fix:{angle:info.angle,photo:info.photo,trimmed:!!box}};
}
function grayOf(canvas,W){const H=Math.round(canvas.height*W/canvas.width);const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(canvas,0,0,W,H);const d=x.getImageData(0,0,W,H).data;const g=new Uint8Array(W*H);for(let i=0,p=0;i<d.length;i+=4,p++)g[p]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;return {g,W,H}}
function analyze(canvas){
 const {g,W,H}=grayOf(canvas,320);const hist=new Uint32Array(256);for(let i=0;i<g.length;i++)hist[g[i]]++;
 let bg=255,mx=0;for(let v=100;v<256;v++)if(hist[v]>mx){mx=hist[v];bg=v}
 const thr=bg-Math.max(50,bg*0.3);
 // skew: score = variance of row ink counts after shearing by angle
 function score(a){const t=Math.tan(a*Math.PI/180);const rows=new Float32Array(H);for(let y=0;y<H;y++)for(let x=0;x<W;x+=2){const yy=Math.round(y+(x-W/2)*t);if(yy<0||yy>=H)continue;if(g[yy*W+x]<thr)rows[y]++}let m=0;for(let y=0;y<H;y++)m+=rows[y];m/=H;let v=0;for(let y=0;y<H;y++)v+=(rows[y]-m)*(rows[y]-m);return v}
 let best=0,bs=score(0);for(let a=-3;a<=3;a+=0.25){if(a===0)continue;const sc=score(a);if(sc>bs*1.02){bs=sc;best=a}}
 return {angle:best,bg,photo:bg<225}
}
function flatten(canvas,info){const w=canvas.width,h=canvas.height;const bgc=document.createElement('canvas');const sw=Math.max(8,Math.round(w/40)),shh=Math.max(8,Math.round(h/40));bgc.width=sw;bgc.height=shh;const bx=bgc.getContext('2d');bx.filter='blur(2px)';bx.drawImage(canvas,0,0,sw,shh);const bd=bx.getImageData(0,0,sw,shh).data;
 const x=canvas.getContext('2d');const img=x.getImageData(0,0,w,h);const d=img.data;
 for(let y=0;y<h;y++){const by=Math.min(shh-1,(y*shh/h)|0);for(let xx=0;xx<w;xx++){const bxi=Math.min(sw-1,(xx*sw/w)|0);const bi=(by*sw+bxi)*4;const bgv=Math.max(40,(bd[bi]*299+bd[bi+1]*587+bd[bi+2]*114)/1000);const i=(y*w+xx)*4;const gv=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;let v=gv/bgv*255;v=(v-120)*1.6+120;v=v<0?0:v>255?255:v;d[i]=d[i+1]=d[i+2]=v}}
 x.putImageData(img,0,0);return canvas}
function rotateCanvas(canvas,deg){const r=deg*Math.PI/180;const w=canvas.width,h=canvas.height;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.translate(w/2,h/2);x.rotate(r);x.drawImage(canvas,-w/2,-h/2);return c}
function inkBox(canvas){const {g,W,H}=grayOf(canvas,400);const hist=new Uint32Array(256);for(let i=0;i<g.length;i++)hist[g[i]]++;let bg=255,mx=0;for(let v=100;v<256;v++)if(hist[v]>mx){mx=hist[v];bg=v}const thr=bg-Math.max(50,bg*0.3);
 let top=-1,bot=-1,left=W,right=-1;for(let y=0;y<H;y++){let n=0;for(let x=0;x<W;x++)if(g[y*W+x]<thr){n++;if(x<left)left=x;if(x>right)right=x}if(n>=2){if(top<0)top=y;bot=y}}
 if(top<0||right<left)return null;const k=canvas.width/W;const pad=Math.round(14*k/ (canvas.width/400)*0.5+12);
 const bx={x:Math.max(0,Math.round(left*k)-pad),y:Math.max(0,Math.round(top*k)-pad),w:0,h:0};bx.w=Math.min(canvas.width,Math.round((right+1)*k)+pad)-bx.x;bx.h=Math.min(canvas.height,Math.round((bot+1)*k)+pad)-bx.y;
 if(bx.w<canvas.width*0.3||bx.h<canvas.height*0.3)return null;if(bx.w>canvas.width-8&&bx.h>canvas.height-8)return null;return bx}
function cropCanvas(canvas,b){const c=document.createElement('canvas');c.width=b.w;c.height=b.h;c.getContext('2d').drawImage(canvas,b.x,b.y,b.w,b.h,0,0,b.w,b.h);return c}
function detectGaps(canvas){
 const W=Math.min(600,canvas.width),H=Math.round(canvas.height*W/canvas.width);
 const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.drawImage(canvas,0,0,W,H);
 const d=ctx.getImageData(0,0,W,H).data;const g=new Uint8Array(W*H);const hist=new Uint32Array(256);
 for(let i=0,p=0;i<d.length;i+=4,p++){const v=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;g[p]=v;hist[v]++}
 let bg=255,mx=0;for(let v=120;v<256;v++)if(hist[v]>mx){mx=hist[v];bg=v}
 const thr=bg-Math.max(60,bg*0.35);
 const ratio=new Float32Array(H);for(let y=0;y<H;y++){let n=0;for(let x=0;x<W;x++)if(g[y*W+x]<thr)n++;ratio[y]=n/W}
 const minLen=Math.max(4,Math.round(H/150));const gaps=[];let y=0;
 while(y<H){if(ratio[y]<0.004){const s0=y;while(y<H&&ratio[y]<0.004)y++;if(y-s0>=minLen)gaps.push({s:s0,e:y})}else y++}
 const k=canvas.height/H;return gaps.map(q=>({s:Math.round(q.s*k),e:Math.round(q.e*k)}));
}
function autoCut(piece,y){let best=null;for(const q of (piece.gaps||[])){if(q.e<=y+4&&(best===null||q.e>best.e))best=q}if(!best)return null;return Math.round((best.s+best.e)/2)}

function ytId(u){if(!u)return null;const m=u.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:null}
function ytStart(u){const m=(u||'').match(/[?&#]t=(\d+)/);return m?+m[1]:0}

/* ---------- notes ---------- */
function notesOfMarker(item,mid){return (item.notes||[]).filter(n=>n.marker===mid)}
function noteVisible(n,ctx){ // ctx: {mode:'edit'|'play', session, f:{leader,session,mine}}
 if(ctx.mode==='edit')return true;
 const my=me().name;
 if(n.layer==='leader')return ctx.f.leader&&(!n.session||n.session===ctx.session);
 if(n.layer==='session')return ctx.f.session&&n.session===ctx.session;
 if(n.layer==='mine')return ctx.f.mine&&n.author===my;
 return false;
}
function noteChip(n){const who=n.layer==='leader'?'인도자':n.layer==='session'?(n.session||'세션'):'나';return `<span class="m ${n.layer}" data-note="${n.id}" title="${esc(n.text)}"><span class="who">${esc(who)}</span>${esc(n.text)}</span>`}

/* ---------- sheet renderer ---------- */
function sheetHTML(item,W,ctx){
 const mods=modsFor(item.form);let html='';
 const pieces=item.pieces||[];
 pieces.forEach((p,pi)=>{
  const s=W/p.w;const notesBy={};
  (p.markers||[]).forEach(m=>{notesBy[m.id]=notesOfMarker(item,m.id).filter(n=>noteVisible(n,ctx))});
  const stripMarkers=(p.markers||[]).filter(m=>m.cut!=null&&notesBy[m.id].length>0).sort((a,b)=>a.cut-b.cut);
  const bounds=[0,...stripMarkers.map(m=>m.cut),p.h];
  html+=`<div class="piece" data-piece="${p.id}">`;
  if(pieces.length>1)html+=`<div class="phead"><span class="ln"></span>조각 ${pi+1}${p.name?' · '+esc(p.name):''}<span class="ln"></span></div>`;
  for(let i=0;i<bounds.length-1;i++){
   const a=bounds[i],b=bounds[i+1];
   if(i>0){const m=stripMarkers[i-1];html+=stripHTML(m,notesBy[m.id],mods,ctx)}
   if(b-a<=0)continue;
   html+=`<div class="slice ${ctx.tool?'tool':''}" data-piece="${p.id}" data-start="${a}" style="height:${(b-a)*s}px;background-image:url('${url(p.blob)}');background-size:${W}px auto;background-position:0 ${-a*s}px">`;
   (p.hls||[]).forEach(h=>{if(h.y>=a&&h.y<b)html+=`<div class="hl" data-hl="${h.id}" style="left:${h.x*s}px;top:${(h.y-a)*s}px;width:${h.w*s}px;height:${Math.min(h.h,b-h.y)*s}px"></div>`});
   (p.markers||[]).forEach(m=>{
    const inStrip=stripMarkers.includes(m);
    if(ctx.mode==='edit'&&m.cut!=null&&m.cut>a&&m.cut<b&&!inStrip)html+=`<div class="cutline" data-cut="${m.id}" style="top:${(m.cut-a)*s}px"><i></i><b>${esc(m.label)}</b></div>`;
    if(inStrip)return;
    if(m.y>=a&&m.y<b){const cnt=notesBy[m.id].length;html+=`<span class="mkabs mk ${ctx.tool==='memo'?'now':''}" data-marker="${m.id}" style="left:${m.x*s}px;top:${(m.y-a)*s}px">${esc(m.label)}${cnt&&m.cut==null?`<span class="badge">${cnt}</span>`:''}</span>`}
   });
   html+=`</div>`;
  }
  html+=`</div>`;
 });
 if(!pieces.length)html+=`<div class="muted" style="padding:40px 20px;text-align:center">${ctx.mode==='edit'?'오른쪽 위 "조각 추가"로 악보 이미지를 넣으세요.<br><span class="hint">스크린샷·스캔 권장. 사진도 됩니다.</span>':'악보가 없습니다.'}</div>`;
 return html;
}

 if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
 const seed=document.getElementById('seed');if(seed&&seed.textContent.trim()){try{const d=JSON.parse(seed.textContent);if(!S.seedAt||d.at>S.seedAt){S.seedAt=d.at;await importJSON(new Blob([seed.textContent],{type:'application/json'}))}}catch(e){console.warn('seed',e)}}
 // 서버 감지: /api 가 있으면 로그인·팀 흐름, 없으면(정적 호스팅) 기기 안에서만. 네트워크가 끊겼으면 마지막으로 받은 팀 정보로 그대로 진행
 NET.server=await probeServer();
 if(NET.server===true){try{takeMe(await api('/me'))}catch(e){if(e.status===401)NET.user=null;else NET.server=null}}
 if(!online()&&!me().name){setTimeout(()=>{render();settingsModal()},0)}else render();
 window.CONTI={S,save,render,parseForm,detectGaps,autoCut,IDB,NET};
})();
})();
</script>

if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){

    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){const t=document.getElementById('toast');if(t){t.textContent='새 버전이 준비됐어요 — 다음에 열면 적용';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}}})});
  }).catch(()=>{})});
}
