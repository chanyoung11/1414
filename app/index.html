<style>
/* ============================================================
   콘티 디자인 시스템 — 모노크롬 미니멀 (TatQ DESIGN.md 이식)
   색은 의미가 있는 곳(상태·송폼 바·악보 마커)에만. 라이트/다크 모두 1급.
   ============================================================ */
:root{
  --radius:8px;--r-sm:4px;--r-md:6px;--r-lg:8px;--r-xl:12px;
  --bg:#FAFAFA;--fg:#0A0A0A;--card:#FFFFFF;--secondary:#F4F4F4;--accent:#EFEFEF;--muted:#F4F4F4;
  --muted-fg:#6E6E6E;--faint-fg:#9A9A9A;--border:#E5E5E5;--border-2:#D4D4D4;--input:#FFFFFF;
  --primary:#0A0A0A;--primary-fg:#FFFFFF;--ring:rgba(10,10,10,.06);
  --surface:rgba(0,0,0,.04);--surface-subtle:rgba(0,0,0,.02);--surface-medium:rgba(0,0,0,.06);--surface-strong:rgba(0,0,0,.10);--surface-border:rgba(0,0,0,.07);
  --destructive:#DC2626;--destructive-soft:rgba(220,38,38,.08);
  --success:#16A34A;--success-soft:rgba(22,163,74,.08);--warning:#B45309;--warning-soft:rgba(180,83,9,.08);
  --shadow-card:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  /* 송폼 바 — 무대에서 한눈에 보이는 노란 바 (제품 규칙, 유지) */
  --form-bg:#0A0A0A;--form-fg:#FFFFFF;--form-soft:rgba(0,0,0,.06);
  /* 레거시 토큰 별칭 (기존 화면 코드가 참조) */
  --bg2:var(--card);--panel:var(--card);--panel2:var(--secondary);--panel3:var(--accent);
  --line:var(--border);--line2:var(--border-2);--ink:var(--fg);--mute:var(--muted-fg);--faint:var(--faint-fg);
  --amber:var(--form-bg);--amberink:var(--form-fg);--amber-soft:var(--form-soft);
  --teal:#0A0A0A;--tealink:#0A0A0A;--teal-soft:#EFEFEF;--red:var(--destructive);--yel:#FFE58A;--r:12px;
  color-scheme:light;
}
html.dark{
  --bg:#0A0A0A;--fg:#F0F0F0;--card:#141414;--secondary:#1F1F1F;--accent:#1F1F1F;--muted:#1C1C1C;
  --muted-fg:#888888;--faint-fg:#666666;--border:#2A2A2A;--border-2:#383838;--input:#1A1A1A;
  --primary:#F0F0F0;--primary-fg:#0A0A0A;--ring:rgba(240,240,240,.08);
  --surface:rgba(255,255,255,.05);--surface-subtle:rgba(255,255,255,.03);--surface-medium:rgba(255,255,255,.08);--surface-strong:rgba(255,255,255,.12);--surface-border:rgba(255,255,255,.07);
  --destructive:#EF4444;--destructive-soft:rgba(239,68,68,.10);
  --success:#22C55E;--success-soft:rgba(34,197,94,.10);--warning:#F59E0B;--warning-soft:rgba(245,158,11,.10);
  --shadow-card:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
  --form-bg:#F0F0F0;--form-fg:#0A0A0A;--form-soft:rgba(255,255,255,.08);
  --teal:#F0F0F0;--tealink:#F0F0F0;--teal-soft:rgba(255,255,255,.10);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:active:not(:disabled){transform:scale(.98)}
a{color:inherit}
::selection{background:rgba(10,10,10,.14)}html.dark ::selection{background:rgba(240,240,240,.14)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:var(--r-sm)}
svg.ic{width:20px;height:20px;flex:0 0 auto;display:block}
#app{height:100%;display:flex;flex-direction:column;color:var(--fg);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)} /* iOS 홈 화면 설치 시 상태바·홈 인디케이터 피함 */
.display{font-family:"Satoshi","Pretendard Variable","Pretendard",sans-serif}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- 상단 바 (편집·보기·연습) ---------- */
.top{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--border);flex:0 0 auto;min-height:52px}
.top h1{font-size:16px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.brand{font-family:"Satoshi","Pretendard Variable","Pretendard",sans-serif;font-weight:700;letter-spacing:-.03em;font-size:18px}
.brand small{font-family:"Pretendard Variable","Pretendard",sans-serif;font-weight:500;color:var(--muted-fg);font-size:12.5px;margin-left:8px;letter-spacing:0}
.titlein{background:transparent;border:0;outline:none;font-weight:700;font-size:16px;letter-spacing:-.02em;width:100%;min-width:0;padding:4px 0;border-bottom:1px solid transparent}
.titlein:focus{border-bottom-color:var(--fg)}
.titlein.big{font-size:19px}
.titlein::placeholder{color:var(--faint-fg);font-weight:500}
.titlewrap{display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:text}
.titlewrap .titlein{flex:1;min-width:0}
.penic{color:var(--faint-fg);display:inline-flex;flex:0 0 auto}
.penic svg.ic{width:15px;height:15px}
.titlewrap:focus-within .penic{color:var(--fg)}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-md);padding:0 14px;height:36px;background:var(--secondary);color:var(--fg);border:1px solid var(--border);font-size:13px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;line-height:1;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--muted-fg)}
.btn svg.ic{width:16px;height:16px}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:transparent;font-weight:600}
.btn.pri:hover{opacity:.9}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px}
.btn.ghost{background:transparent;color:var(--muted-fg)}
.btn.ghost:hover{color:var(--fg);background:var(--secondary)}
.btn.danger{color:var(--destructive);background:var(--destructive-soft);border-color:transparent}
.btn.outline{background:transparent}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.wide{width:100%;height:40px}
.icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--secondary);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:0 0 auto;transition:border-color .15s,background .15s}
.icon:hover{border-color:var(--muted-fg)}
.icon.sm{width:30px;height:30px}
.icon.sm svg.ic{width:15px;height:15px}
.icon.ghost{background:transparent;border-color:transparent;color:var(--muted-fg)}
.icon.ghost:hover{background:var(--secondary);color:var(--fg)}
.icon:disabled{opacity:.3}

/* ---------- 칩·배지·세그먼트 ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 10px;height:26px;font-size:12px;margin:2px 4px 2px 0;background:var(--secondary);border:1px solid var(--surface-border);color:var(--fg);white-space:nowrap;line-height:1;font-weight:500}
.chip.s{background:var(--form-soft);border-color:transparent;color:var(--fg);font-weight:600}
.chip.on{background:var(--primary);color:var(--primary-fg);border-color:transparent}
.chip.dim{color:var(--faint-fg)}
.chip.mod{background:var(--accent);border-color:var(--border);color:var(--fg);font-weight:600}
.chip.x{border:1px dashed var(--border-2);background:transparent;color:var(--muted-fg)}
.chip.t{height:22px;font-size:11px;padding:0 8px}
.seg{display:inline-flex;background:var(--secondary);border:1px solid var(--border);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:600;color:var(--muted-fg);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button svg.ic{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 9px;height:22px;font-size:11.5px;font-weight:500;background:var(--secondary);border:1px solid var(--border);color:var(--muted-fg);white-space:nowrap}
.pill.amber{background:var(--success-soft);border-color:transparent;color:var(--success);font-weight:600}
.pill.key{background:var(--primary);border-color:transparent;color:var(--primary-fg);font-weight:700;font-size:12px;height:24px;padding:0 9px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:"";display:block;width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--success-soft);color:var(--success)}
.badge.warn{background:var(--warning-soft);color:var(--warning)}
.badge.neutral{background:var(--secondary);border:1px solid var(--border);color:var(--muted-fg)}
.kicker{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-fg)}

/* ---------- 폼 ---------- */
.lbl{font-size:12px;color:var(--fg);margin:14px 0 6px;font-weight:600;display:flex;align-items:center;gap:6px}
.lbl .hint{font-weight:400}
.field{width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:0 12px;height:38px;background:var(--input);outline:none;color:var(--fg);transition:border-color .15s,box-shadow .15s}
.field::placeholder{color:var(--faint-fg)}
.field:focus{border-color:var(--fg);box-shadow:0 0 0 3px var(--ring)}
textarea.field{resize:vertical;min-height:64px;line-height:1.5;padding:9px 12px;height:auto}
.pillin{background:var(--input);border:1px solid var(--border);border-radius:999px;height:32px;padding:0 10px;width:76px;text-align:center;font-weight:700;outline:none}
.pillin:focus{border-color:var(--fg);box-shadow:0 0 0 3px var(--ring)}
.pillin::placeholder{color:var(--faint-fg);font-weight:500}
.fbox{border:1px solid var(--border);border-radius:var(--r-lg);padding:10px;background:var(--muted)}
.hr{height:1px;background:var(--border);margin:4px 0 6px}
.ytc{color:#FF3D3D}.icon.ytc{background:rgba(255,61,61,.10);border-color:transparent}
.micc{color:var(--fg)}.icon.micc{background:var(--secondary)}
.chip.on .ytc,.chip.on .micc{color:inherit}
.songbar{width:100%;display:block;background:var(--form-bg);color:var(--form-fg);border:0;border-radius:var(--r-md);padding:8px 11px;font-family:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;font-weight:600;outline:none;line-height:1.45;white-space:pre-wrap;word-break:break-word}
textarea.songbar{resize:none;overflow:hidden;min-height:36px}
.songbar::placeholder{color:rgba(255,255,255,.5);font-weight:500}
html.dark .songbar::placeholder{color:rgba(10,10,10,.5)}
.songbar:focus{box-shadow:0 0 0 3px var(--ring)}
.mono{font-family:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;width:100%;margin:0 auto;padding:18px 18px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-card)}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.row.small{flex-wrap:wrap;row-gap:6px}.row.small>.hint{white-space:nowrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted-fg)}
.small{font-size:13px}
.hint{font-size:12px;color:var(--muted-fg)}
.sec{margin-top:18px}
.err{color:var(--destructive);font-size:12.5px;margin-top:8px;min-height:16px}
.err:not(:empty){border:1px solid rgba(220,38,38,.4);background:var(--destructive-soft);border-radius:var(--r-lg);padding:8px 12px;margin-top:12px}

/* ---------- 마커·태그 ---------- */
.mk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--fg);background:var(--card);color:var(--fg);font-size:12px;font-weight:700;flex:0 0 auto;line-height:1}
.mk.now{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.tag{font-size:11px;padding:2px 7px;border-radius:var(--r-sm);background:var(--secondary);border:1px solid var(--border);color:var(--muted-fg);white-space:nowrap;font-weight:600}
.tag.me{background:var(--accent);color:var(--muted-fg)}
.num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--muted-fg);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-variant-numeric:tabular-nums}

/* ---------- 리스트 ---------- */
.list-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-lg);cursor:pointer;position:relative;border:1px solid transparent;transition:background .12s}
.list-item:hover{background:var(--surface)}
.list-item.sel{background:var(--accent);border-color:var(--border)}
.list-item .k{color:var(--muted-fg);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.grip{color:var(--faint-fg);cursor:grab;touch-action:none;display:inline-flex;padding:4px 2px;margin-left:-4px}
.grip svg.ic{width:14px;height:14px}
.list-item.dragging{background:var(--card);opacity:.95;box-shadow:0 12px 32px rgba(0,0,0,.25);border-color:var(--border)}
.list-item.dragging .grip{cursor:grabbing}
/* 코드 차트 */
.chart{font-size:13px}
.chart .chd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chart .pill.amber{background:var(--warning-soft);color:var(--warning);font-weight:700}
.csec{margin-bottom:12px}
.cshd{display:flex;align-items:center;gap:6px;margin-bottom:4px}.cshd b{font-size:12.5px;letter-spacing:.02em;color:var(--muted-fg)}
.cbars{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0;border-left:1px solid var(--border-2)}
.cbar{border-right:1px solid var(--border-2);border-bottom:1px solid var(--line2);padding:6px 8px;min-height:44px}
.cch{font-family:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:14px;letter-spacing:-.01em;display:flex;gap:8px;flex-wrap:wrap}
.cc{cursor:default}[data-cc]{cursor:pointer;border-radius:4px;padding:0 2px}[data-cc]:hover{background:var(--muted)}
.cc.dim{color:var(--faint-fg);font-weight:400}
.clr{margin-top:3px;font-size:12px;color:var(--muted-fg);line-height:1.35}
.chart.big{font-size:16px}.chart.big .cch{font-size:20px}.chart.big .clr{font-size:14px}.chart.big .cbars{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.cwrap{margin-top:10px;border:1px solid var(--border);border-radius:var(--r-lg);padding:8px 12px;background:var(--card)}
.cwrap summary{cursor:pointer;font-size:12.5px;color:var(--muted-fg);list-style:none}.cwrap summary::-webkit-details-marker{display:none}
.cwrap summary::before{content:'▸ ';}.cwrap[open] summary::before{content:'▾ ';}
.cwrap[open] summary{margin-bottom:8px}
/* §4.2 말씀 탭 */
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media(max-width:860px){.wgrid{grid-template-columns:minmax(0,1fr)}}
.wrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-lg);border:1px solid transparent;cursor:pointer}
.wrow:hover{background:var(--muted)}.wrow.on{border-color:var(--fg);background:var(--muted)}.wrow.past{opacity:.55}
.wrow .wd{width:44px;text-align:center;flex:0 0 auto}.wrow .wd b{display:block;font-size:14px}.wrow .wd span{font-size:11px;color:var(--muted-fg)}
.wrow b{display:block;font-size:13.5px}
/* §5 합주 녹음 */
.rehrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line2);cursor:pointer}.rehrow:last-child{border-bottom:0}.rehrow b{display:block;font-size:13.5px}
.rhprog{position:relative;height:8px;border-radius:999px;background:var(--muted);margin-top:14px;cursor:pointer;overflow:visible}
.rhprog i{display:block;height:100%;border-radius:999px;background:var(--fg);width:0}
.rhprog .ticks i{position:absolute;top:-3px;width:2px;height:14px;border-radius:1px;background:var(--warning)}
.reheard{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}.reheard .tl{cursor:pointer}.reheard .hint{display:block;margin-top:2px}
/* §3 편성: 달력 · 석 달 표 · 그날 편성 */
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal-hd b{font-size:15px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}.cal-wd span{text-align:center;font-size:11.5px;color:var(--muted-fg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{position:relative;aspect-ratio:1;border-radius:var(--r-md);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;background:var(--muted);color:var(--faint-fg)}
.cal-cell.blank{background:none}
.cal-cell.on{background:var(--card);border-color:var(--border);color:var(--fg);cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.cal-cell.on:active{transform:scale(.96)}
.cal-cell.past{opacity:.45;pointer-events:none}
.cal-cell.dim{opacity:.3}
.cal-cell .d{font-weight:600;line-height:1}.cal-cell .sym{font-size:12px;line-height:1}
.cal-cell .lb{font-size:9.5px;color:var(--muted-fg);line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-cell .mys{position:absolute;top:2px;right:3px;font-size:9px;font-weight:700;color:var(--fg)}
.cal-cell.assigned{border-color:var(--fg);border-width:2px}
.cal-cell .memodot{position:absolute;bottom:3px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--muted-fg)}
.a-ok{color:#4E9E6E}.a-maybe{color:#B08A22}.a-no{color:#C0574A}.a-unset{color:var(--faint-fg)}
html.dark .a-ok{color:#5FBF8A}html.dark .a-maybe{color:#E9C35C}html.dark .a-no{color:#E4816F}
.cal-cell.a-ok.on{background:rgba(95,191,138,.13)}.cal-cell.a-maybe.on{background:rgba(233,195,92,.13)}.cal-cell.a-no.on{background:rgba(228,129,111,.13)}
.cal-foot{margin-top:10px;font-size:12.5px;color:var(--muted-fg)}
.cal-leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--muted-fg)}.cal-leg span{display:inline-flex;align-items:center;gap:4px}.cal-leg i{font-style:normal}
.schwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card)}
.schtab{border-collapse:collapse;font-size:12.5px;min-width:100%}
.schtab th,.schtab td{border-bottom:1px solid var(--line2);padding:5px 7px;text-align:center;white-space:nowrap}
.schtab .corner{position:sticky;left:0;background:var(--card);z-index:2}
.schtab .mname{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;z-index:1;display:flex;align-items:center;gap:6px;justify-content:space-between}
.schtab .dcol{cursor:pointer;font-weight:700}.schtab .dcol small{display:block;font-weight:400;color:var(--muted-fg);font-size:10.5px}
.schtab .sess-hd th{text-align:left;background:var(--muted);color:var(--muted-fg);font-size:11.5px;font-weight:700;position:sticky;left:0}
.schtab td.lined{outline:2px solid var(--fg);outline-offset:-3px;border-radius:4px}.schtab td.lined.pending{outline-style:dashed}
.lrow{padding:12px 0;border-bottom:1px solid var(--line2)}
.lsess{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:6px}
.lslot{margin-bottom:6px}.lslot select{width:100%;padding:9px 11px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--input);font-size:13.5px}
.lwarn{margin-top:4px;font-size:12px;color:var(--warning)}
.wordblock{margin:8px 0;padding:10px 14px;border-left:3px solid var(--warning);background:var(--muted);border-radius:0 var(--r-md) var(--r-md) 0}
.wordblock b{font-size:14px;display:block}.wordblock .wtitle{font-weight:700;font-size:15px;margin-top:1px}.wordblock .wline{color:var(--muted-fg);font-size:13px;margin-top:2px}
.wordblock .wfrom,.wordblock .wlock{color:var(--muted-fg);font-size:12px;text-align:right}.wordblock .wlock{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-bottom:4px}.wordblock .wlock svg{width:13px;height:13px}
.wordblock .wmemo{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:13px}.wordblock .wmemo .pill{margin-bottom:4px}
.wordline{display:flex;align-items:center;gap:7px;padding:9px 13px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);cursor:pointer;font-size:13px}.wordline svg{width:15px;height:15px;flex:0 0 auto;color:var(--muted-fg)}
.reason{display:flex;align-items:flex-start;gap:6px;margin-top:6px;color:var(--muted-fg);font-size:12.5px}.reason svg{width:13px;height:13px;flex:0 0 auto;margin-top:2px}
.hero{margin-bottom:14px;padding:14px 16px;border-radius:var(--r-xl);border:1px solid var(--border-2);background:var(--card)}
.hero .hd2{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero .when{flex:0 0 auto;font-weight:800;font-size:15px;letter-spacing:-.02em;padding:5px 10px;border-radius:999px;background:var(--fg);color:var(--bg)}
.hero b{display:block;font-size:15px;letter-spacing:-.01em}
.todo{margin-bottom:16px}.todo-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}.todo-hd b{font-size:14px;letter-spacing:-.01em}
.todo-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);background:var(--secondary);border:1px solid var(--border-2);margin-bottom:8px}.todo-card b{display:block;font-size:13.5px}
.nrow{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2);cursor:pointer}.nrow .dot{width:6px;height:6px;border-radius:50%;background:var(--fg);margin-top:8px;flex:0 0 auto;opacity:0}.nrow.unread .dot{opacity:1}.nrow:not(.unread){opacity:.72}.nrow b{display:block;font-size:13.5px}
.navi .cnt.badge-n{background:var(--fg);color:var(--bg);border-radius:999px;min-width:18px;text-align:center;font-weight:700}.navi .cnt[hidden]{display:none}
.bnav .bdot{position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--fg)}.bnav .bdot[hidden]{display:none}
.svcrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:background .12s,border-color .12s}
.svcrow:hover{background:var(--muted);border-color:var(--border-2)}
.svcrow.past{opacity:.6}
.svcrow .date{width:52px;text-align:center;flex:0 0 auto;font-variant-numeric:tabular-nums}
.svcrow .date b{display:block;font-size:17px;letter-spacing:-.03em;line-height:1.1;font-family:"Satoshi","Pretendard Variable",sans-serif;font-weight:700}
.svcrow .date span{font-size:11.5px;color:var(--muted-fg)}
.svcrow .t{font-weight:700;font-size:14.5px;letter-spacing:-.02em}
.svcrow .s{color:var(--muted-fg);font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- 홈 대시보드 셸 ---------- */
.shell{flex:1;min-height:0;display:flex;gap:20px;width:100%;max-width:1360px;margin:0 auto;padding:16px 16px 92px}
.side{display:none;position:sticky;top:16px;width:200px;flex:0 0 auto;height:calc(100vh - 32px)}
.side .box{display:flex;flex-direction:column;height:100%;padding:12px;background:var(--card);border:1px solid var(--surface-border);border-radius:var(--r-xl);box-shadow:var(--shadow-card)}
.side .head{display:flex;align-items:center;gap:8px;padding:6px 8px 8px}
.side nav{margin-top:8px;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.side .sect{padding:14px 12px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--faint-fg)}
.side .sect:first-child{padding-top:0}
.navi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r-md);font-size:13px;font-weight:500;color:var(--muted-fg);text-align:left;width:100%;transition:background .12s,color .12s}
.navi svg.ic{width:15px;height:15px}
.navi:hover{background:var(--muted);color:var(--fg)}
.navi.on{background:var(--surface-medium);color:var(--fg);font-weight:600}
.navi .cnt{margin-left:auto;font-size:11px;color:var(--faint-fg);font-variant-numeric:tabular-nums}
.side .foot{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.side .foot .who{padding:2px 6px;font-size:12px;color:var(--muted-fg);display:flex;align-items:center;justify-content:space-between;gap:8px}
.side .foot .who b{color:var(--fg);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 18px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card)}
.hd .ttl{display:flex;align-items:baseline;gap:12px;min-width:0}
.hd h1{margin:0;font-family:"Satoshi","Pretendard Variable",sans-serif;font-size:20px;font-weight:700;letter-spacing:-.025em;white-space:nowrap}
.hd .date{font-size:13px;color:var(--muted-fg);white-space:nowrap}
.hd .acts{display:flex;align-items:center;gap:6px}
.sect-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 12px}
.sect-hd h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em}
.sect-hd p{margin:3px 0 0;font-size:12.5px;color:var(--muted-fg)}
.bnav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;border:1px solid var(--surface-border);border-radius:var(--r-xl);background:var(--card);padding:6px;box-shadow:0 24px 56px -28px rgba(0,0,0,.6);backdrop-filter:blur(10px);display:grid;grid-auto-flow:column;gap:4px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:var(--r-lg);font-size:11px;font-weight:600;color:var(--muted-fg)}
.bnav button svg.ic{width:18px;height:18px}
.bnav button.on{background:var(--primary);color:var(--primary-fg)}
.empty{padding:36px 20px;text-align:center;color:var(--muted-fg);border:1px dashed var(--border);border-radius:var(--r-xl);background:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px;letter-spacing:-.02em}
.empty .btn{margin-top:14px}
.more-only{display:none}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.metric{padding:14px 16px;border:1px solid var(--surface-border);border-radius:var(--r-xl);background:var(--secondary)}
.metric .v{font-family:"Satoshi","Pretendard Variable",sans-serif;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.metric .l{font-size:11.5px;color:var(--muted-fg);margin-top:4px}
@media (min-width:1024px){.side{display:block}.bnav{display:none}.shell{padding-bottom:24px}}
@media (prefers-reduced-motion:no-preference){.rise{opacity:0;animation:surface-rise .6s cubic-bezier(.22,1,.36,1) forwards}.rise.d1{animation-delay:60ms}.rise.d2{animation-delay:110ms}.rise.d3{animation-delay:160ms}}
@keyframes surface-rise{0%{opacity:0;transform:translate3d(0,12px,0) scale(.99)}100%{opacity:1;transform:none}}

/* ---------- 워크스페이스 패널 (편집·연습) ---------- */
.ws{flex:1;min-height:0;display:grid;gap:8px;padding:8px;background:var(--bg)}
.ws.split{grid-template-columns:var(--lw,44%) 6px minmax(0,1fr)}
.stack{display:grid;grid-template-rows:fit-content(50%) 6px minmax(0,1fr);gap:0;min-height:0;min-width:0}
.vgutter{cursor:row-resize;touch-action:none;position:relative;z-index:2}
.vgutter::before{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.vgutter::after{content:"";position:absolute;top:2px;left:50%;height:2px;width:36px;margin-left:-18px;border-radius:1px;background:var(--border-2)}
.vgutter:hover::after,.vgutter.drag::after{background:var(--fg)}
.gutter{border-radius:4px;cursor:col-resize;touch-action:none;position:relative}
.gutter::before{content:"";position:absolute;top:0;bottom:0;left:-8px;right:-8px}
.gutter::after{content:"";position:absolute;left:2px;top:50%;width:2px;height:36px;margin-top:-18px;border-radius:1px;background:var(--border-2)}
.gutter:hover::after,.gutter.drag::after{background:var(--fg)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;box-shadow:var(--shadow-card);position:relative}
.panel.drop::after{content:"악보 사진을 여기에 놓으세요";position:absolute;inset:6px;border:2px dashed var(--fg);border-radius:var(--r-lg);background:var(--surface-medium);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;z-index:5;pointer-events:none}
.ptab{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 14px;background:var(--card);border-bottom:1px solid var(--border);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.ptab::-webkit-scrollbar{display:none}
.ptab .tab,.ptab .sub,.ptab .btn,.seg button,.ptab .chip{white-space:nowrap;flex:0 0 auto}
.ptab .tab{height:40px;display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--fg);position:relative}
.ptab .sub{font-size:12px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pbody{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.pfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--border);font-size:13px;background:var(--card)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex:0 0 auto;min-height:52px}
.bar b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:16px;letter-spacing:-.02em}

/* ---------- 악보 (항상 흰 종이) ---------- */
.sheetwrap{flex:1;min-height:0;overflow:auto;background:var(--muted);-webkit-overflow-scrolling:touch;padding:14px;touch-action:pan-x pan-y}
.sheet{position:relative;background:#fff;border-radius:var(--r-xl);padding:12px 12px 70px 44px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.06);
 --panel:#fff;--panel2:#F2F3EE;--panel3:#E6E7E1;--ink:#1B1C19;--mute:#6D7069;--faint:#9A9D94;--line:#D6D8D0;--line2:#B9BCB2;--teal-soft:#EFEFEF;--teal:#0A0A0A;--tealink:#0A0A0A;--amber-soft:#EFEFEF;--amber:#0A0A0A;
 --fg:#1B1C19;--card:#fff;--secondary:#F2F3EE;--accent:#E6E7E1;--muted-fg:#6D7069;--faint-fg:#9A9D94;--border:#D6D8D0;--border-2:#B9BCB2;color:var(--ink)}
html.dark .sheet{box-shadow:0 10px 40px rgba(0,0,0,.5);border-color:transparent}
.sheet .mk{background:#fff;border-color:#1B1C19;color:#1B1C19}
.sheet .mk.now{background:#0A0A0A;border-color:#0A0A0A;color:#fff}
.piece{position:relative;margin-bottom:16px}
.piece .phead{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;margin:0 0 6px -32px}
.piece .phead span.ln{flex:1;height:1px;background:var(--line2)}
.slice{position:relative;background-repeat:no-repeat;background-color:#fff;touch-action:pan-y}
.slice.tool{cursor:crosshair}
.hltool .slice{touch-action:none}
.mkabs{position:absolute;transform:translate(-50%,-50%);z-index:3}
.mkabs::before,.strip .mk::before,.addm::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.strip .mk,.addm{position:relative}
.mkabs .badge{position:absolute;right:-9px;top:-7px;background:var(--destructive);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;line-height:15px}
.mkabs .badge::before{display:none}
.hl{position:absolute;background:var(--yel);opacity:.55;border-radius:3px;pointer-events:none}
.hl.mask{background:#fff;opacity:.86;border-radius:2px}
.hltool .hl.mask{outline:1.5px dashed #B9BCB2;outline-offset:-1px}
.slice.tool .hl[data-hl]{pointer-events:auto;cursor:pointer}
.cutline{position:absolute;left:-36px;right:0;border-top:1.5px dashed #0A0A0A;pointer-events:auto;cursor:row-resize;touch-action:none;z-index:4}
.cutline::before{content:"";position:absolute;left:0;right:0;top:-12px;bottom:-12px}
.cutline i{position:absolute;right:6px;top:-9px;width:16px;height:16px;border-radius:4px;background:#0A0A0A}
.cutline b{position:absolute;right:26px;top:-9px;font-size:10px;line-height:16px;color:#0A0A0A;font-weight:700}
.cutline.drag{border-top-style:solid;border-top-color:#6E6E6E}
.cutline.drag i{background:#6E6E6E}
.strip{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 0;margin:2px 0 2px -34px;position:relative;min-height:32px;flex-wrap:nowrap;overflow-x:auto}
.strip .mk{margin-right:2px}
.strip .modl{font-size:12px;color:#0A0A0A;font-weight:700;white-space:nowrap}
.m{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;font-size:12.5px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;background:#fff;flex:0 0 auto;color:#1B1C19}
.m .who{font-size:10px;padding:1px 4px;border-radius:3px;background:rgba(0,0,0,.06);color:#6D7069}
.m.leader{background:#0A0A0A;color:#fff}
.m.leader.all{background:#DCEBE6;color:#164E47}
.m.leader.all .who{background:rgba(22,78,71,.14);color:#164E47}
.m.leader .who{background:rgba(255,255,255,.18);color:#fff}
.m.session{border:1px solid #B9BCB2}
.m.mine{border:1.5px dashed #B9BCB2;color:#6D7069}
.m.extra{display:none}
.strip.open .m.extra{display:inline-flex}
.strip.open .more{display:none}
.strip .more{height:26px;font-size:12px;background:#F2F3EE;color:#6D7069;border-radius:999px;padding:0 9px;display:inline-flex;align-items:center}
.addm{width:28px;height:28px;border-radius:50%;border:1px dashed #B9BCB2;background:transparent;color:#6D7069;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.addm svg.ic{width:14px;height:14px}

/* ---------- 무대 모드 ---------- */
.stage .media{display:none!important}
.stage .stack,.stage .gutter,.stage .top{display:none!important}
.stage .ws{padding:0;gap:0}
.stage .panel{border:0;border-radius:0;box-shadow:none}
.sbtn{width:30px;height:30px;border-radius:7px;background:rgba(0,0,0,.12);color:inherit;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.sbtn:disabled{opacity:.3}
.sbtn svg.ic{width:16px;height:16px}
.stage .ws.split{grid-template-columns:minmax(0,1fr)}
.stage #sheetpanel .ptab{display:none}
.stage .stagebar{display:flex}
.stagebar{display:none;align-items:center;gap:10px;padding:7px 12px;background:var(--form-bg);color:var(--form-fg);font-size:12.5px;white-space:nowrap;overflow-x:auto;flex:0 0 auto}
.stagebar [data-act="stage"]{position:sticky;right:0;margin-left:auto;background:var(--form-bg);box-shadow:-10px 0 10px var(--form-bg)} /* 좁은 화면에서 가로 스크롤돼도 종료 버튼은 항상 보이게 */
.stagetitle{font-weight:800;flex:0 0 auto;letter-spacing:-.02em}
.stageform{font-family:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;font-weight:600}
.stagenote{opacity:.75;flex:0 0 auto}
.songnav{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.nb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nb.prev,.nb.next{color:var(--faint-fg);font-size:12.5px;flex:0 1 22%;cursor:pointer}
.nb.prev{text-align:right}
.nb.cur{font-weight:700;font-size:15px;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:8px;flex:0 1 auto;max-width:52%}
.nb.cur .num{flex:0 0 auto}
.stage .stack{grid-template-rows:minmax(0,1fr)!important}
.stage .vgutter{display:none}
.stage .filters{display:none!important}
.stage .sheetwrap{padding:6px;background:#111}
.stage .sheet{border-radius:8px;filter:brightness(.92);max-width:1000px;margin:0 auto}

/* ---------- 미디어·플레이어 ---------- */
.media{flex:0 0 auto}
.vid{position:relative;background:#000;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:16/9;max-height:36vh;border:1px solid var(--border)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .fb{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px;gap:8px}
.now{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-xl);background:var(--secondary);border:1px solid var(--surface-border)}
.now .art{width:48px;height:48px;border-radius:var(--r-lg);background:var(--accent);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wave i{display:block;width:3px;border-radius:1px;background:var(--faint-fg)}
.transport{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 2px}
.tbtn{width:40px;height:40px;border-radius:50%;background:var(--secondary);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.tbtn.pri{width:52px;height:52px;background:var(--primary);color:var(--primary-fg);border-color:transparent}
.tbtn.pri svg.ic{width:22px;height:22px}
.prog{flex:1;height:5px;background:var(--accent);border-radius:3px;position:relative;cursor:pointer}
.prog .fill{position:absolute;left:0;top:0;height:5px;background:var(--fg);border-radius:3px}
.prog .tick{position:absolute;top:-4px;width:2px;height:13px;background:var(--muted-fg);border-radius:1px}
.tl{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:var(--r-md);cursor:pointer;font-size:13px;transition:background .12s}

function ptab(name,sub,right){return `<div class="ptab"><span class="tab">${esc(name)}</span>${sub?`<span class="sub">${sub}</span>`:''}<span class="grow"></span>${right||''}</div>`}
function initGutter(onEnd){const ws=$('#ws');if(!ws)return;initVGutter(onEnd);const g=$('.gutter',ws);if(!g)return;const saved=lsGet('conti-lw');if(saved)ws.style.setProperty('--lw',saved);
 g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);g.classList.add('drag');const r=ws.getBoundingClientRect();g.onpointermove=ev=>{const w=Math.min(Math.max(ev.clientX-r.left-8,300),r.width-340);ws.style.setProperty('--lw',w+'px')};
  g.onpointerup=()=>{g.onpointermove=null;g.classList.remove('drag');try{localStorage.setItem('conti-lw',ws.style.getPropertyValue('--lw'))}catch(e){}onEnd&&onEnd()}}}

function initVGutter(onEnd){const st=$('#stack');if(!st)return;const g=$('.vgutter',st);if(!g)return;const key='conti-th-'+route().name;const saved=lsGet(key);if(saved)st.style.gridTemplateRows=saved+'px 6px minmax(0,1fr)';
 g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);g.classList.add('drag');const r=st.getBoundingClientRect();g.onpointermove=ev=>{const h=Math.min(Math.max(ev.clientY-r.top-3,80),r.height-120);st.style.gridTemplateRows=h+'px 6px minmax(0,1fr)'};
  g.onpointerup=()=>{g.onpointermove=null;g.classList.remove('drag');try{localStorage.setItem(key,parseInt(st.style.gridTemplateRows))}catch(e){}onEnd&&onEnd()}}}

const DIRECT_OVER=3.5*1024*1024;
async function uploadBlob(id,b,onProgress,force){
 if(b.size<=DIRECT_OVER){
  const r=await fetch('/api/blobs/'+id+'?team='+S.team.id+(force?'&force=1':''),{method:'POST',headers:{'x-conti':'1','content-type':b.type||'application/octet-stream'},body:b,credentials:'same-origin'});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||'파일 업로드 실패')}
  return true}
 const u=await api('/blobs/'+id+'/upload-url',{method:'POST',body:{teamId:S.team.id,size:b.size,mime:b.type||'application/octet-stream'}});

// 진행률이 보이는 직접 업로드 (fetch 는 진행률이 없어 XHR 사용)
function putDirect(url,file,onProgress){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('PUT',url);
 x.setRequestHeader('content-type',file.type||'application/octet-stream');
 x.upload.onprogress=ev=>{if(ev.lengthComputable&&onProgress)onProgress(Math.round(ev.loaded/ev.total*100))};
 x.onload=()=>x.status>=200&&x.status<300?res():rej(new Error('업로드 실패 ('+x.status+')'));
 x.onerror=()=>rej(new Error('네트워크 오류로 업로드하지 못했어요'));x.send(file)})}

 return `<div class="shell"><div class="main">

   :'<div class="empty"><b>열린 사역 날짜가 없어요</b>팀 관리에서 정기 예배를 등록하거나 날짜를 열어 주세요.</div>'}

 const total=S.team.sessions.reduce((a,s)=>a+(slots[s]!=null?slots[s]:(s==='싱어'?3:1)),0);

/* ---------- IndexedDB ---------- */
const IDB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('conti-v1',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};r.onsuccess=e=>{IDB.db=e.target.result;res()};r.onerror=()=>rej(r.error)})},
 tx(store,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,mode);const s=t.objectStore(store);const q=fn(s);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 get(store,k){return IDB.tx(store,'readonly',s=>s.get(k))},
 put(store,k,v){return IDB.tx(store,'readwrite',s=>s.put(v,k))},
 del(store,k){return IDB.tx(store,'readwrite',s=>s.delete(k))}
};
const urlCache=new Map();
async function blobURL(id){if(!id)return '';if(urlCache.has(id))return urlCache.get(id);const b=await IDB.get('blobs',id);if(!b)return '';const u=URL.createObjectURL(b);urlCache.set(id,u);return u}
const url=id=>urlCache.get(id)||'';

// 같은 예배 합치기 (§9): src 의 곡 중 dst 에 없는 것만 뒤에 붙인다
function mergeInto(dst,src){(src.items||[]).forEach(it=>{if(!dst.items.some(t=>t.title===it.title&&t.key===it.key))dst.items.push(it)});if(!dst.notice&&src.notice)dst.notice=src.notice;if(!dst.message&&src.message)dst.message=src.message;touch(dst)}

 S.team.id=t.teamId;S.team.name=t.teamName;S.team.invite=t.invite||'';S.team.sessions=t.sessions.slice();S.team.phrases=t.phrases.slice();S.team.settings=t.settings||S.team.settings||{};S.team.me={userId:t.me.userId,name:t.me.name,session:t.me.session,mySessions:t.me.mySessions||[],role:t.me.role,capo:+t.me.capo||0};save()}

// 밖에서 들어온 문서(가져오기 파일·서버 발행본·초안·메모)의 id 들은 속성에 그대로 들어가므로 형식을 강제한다. 이상한 값은 새 id 로 바꿈
const ID_RE=/^[A-Za-z0-9_-]{1,64}$/;const ID_KEYS=new Set(['id','blob','marker','libId','mediaId','markerId','itemId']);
function scrubIds(x){if(Array.isArray(x)){x.forEach(scrubIds);return x}if(x&&typeof x==='object'){for(const k in x){const v=x[k];if(ID_KEYS.has(k)){if(v!=null&&v!==''&&!(typeof v==='string'&&ID_RE.test(v)))x[k]=uid()}else if(v&&typeof v==='object')scrubIds(v)}}return x}

/* ---------- 서버 동기화: 발행본 · 파일 · 메모 ---------- */
const SYNC={t:null,pulledAt:{},
 blobIds(items){const ids=[];(items||[]).forEach(it=>{(it.pieces||[]).forEach(p=>p.blob&&ids.push(p.blob));(it.media||[]).forEach(m=>m.type==='audio'&&m.blob&&ids.push(m.blob))});return [...new Set(ids)]},
 // 팀의 발행본 목록을 받아 새 것·새 버전만 내려받음. 바뀐 게 있으면 true
 async pullServices(){if(!online()||!S.team.id)return false;let list,drafts=[];try{const r=await api('/services?team='+S.team.id);list=r.services;drafts=r.drafts||[]}catch(e){return false}
  let changed=false;
  if(isLeader())for(const d of drafts){if(svcById(d.id)||(S.dropped||[]).includes(d.id))continue;try{const dd=await api('/services/'+d.id+'?team='+S.team.id+'&draft=1');if(dd&&dd.doc){
    if(dd.doc.auto&&!(dd.doc.items||[]).length&&S.services.some(x=>x.date===dd.doc.date)){S.dropped=(S.dropped||[]).concat(d.id);continue} // 자동 생성 초안인데 그 날짜 콘티가 이미 있으면 받지 않음
    await SYNC.fetchBlobs(dd.blobs);const cur={id:d.id,name:'',date:today(),notice:'',version:0,items:[],published:null};S.services.push(cur);SYNC.applyDraft(cur,dd.doc);changed=true}}catch(e){console.warn('draft',d.id,e.message)}}
  for(const r of list){const cur=svcById(r.id);const localV=cur&&cur.published?cur.published.version:0;
   if(cur&&localV>=r.version)continue;
   if(!cur&&(S.dropped||[]).includes(r.id))continue;
   if(!cur){const twin=S.services.find(x=>!x.published&&(r.name||'').trim()&&x.name===r.name&&x.date===r.date); // §9 같은 이름·날짜의 내 초안 → 합칠지 묻기
    if(twin&&confirm(`"${r.name}" (${r.date}) 발행본이 서버에 있어요. 이 기기의 같은 이름 초안과 합칠까요?\n(취소하면 둘 다 남아요)`)){try{const pulled=await SYNC.pullService(r.id);mergeInto(pulled,twin);S.services=S.services.filter(x=>x.id!==twin.id);S.dropped=(S.dropped||[]).concat(twin.id);changed=true}catch(e){console.warn('merge',e.message)}continue}}
   try{await SYNC.pullService(r.id);changed=true}catch(e){console.warn('pull',r.id,e.message)}}
  if(changed)save();return changed},
 async pullService(id){const d=await api('/services/'+id+'?team='+S.team.id);const doc=scrubIds(d.doc);await SYNC.fetchBlobs(d.blobs);
  if(d.word!==undefined){const cur0=svcById(id);if(cur0)cur0.word=d.word||null}
  if(d.readRev){S.readRev=S.readRev||{};S.readRev[id]=Math.max(S.readRev[id]||0,d.readRev)}
  let cur=svcById(id);if(!cur){cur={id,name:doc.name,date:doc.date,notice:doc.notice||'',version:0,items:[],published:null};S.services.push(cur);if(d.word!==undefined)cur.word=d.word||null}
  const old=new Map(cur.items.map(it=>[it.id,it]));
  cur.published={version:doc.version,at:new Date(d.updatedAt).getTime()||Date.now(),name:doc.name,date:doc.date,notice:doc.notice||'',message:doc.message||'',messageRev:doc.messageRev||0,word:doc.word||null,author:doc.author||'',items:clone(doc.items)};
  if(!isLeader()||cur.version<=doc.version){ // 인도자 기기의 더 새로운 초안은 건드리지 않음
   cur.name=doc.name;cur.date=doc.date;cur.notice=doc.notice||'';cur.message=doc.message||'';cur.messageRev=doc.messageRev||0;cur.version=doc.version;
   cur.items=clone(doc.items).map(it=>{const o=old.get(it.id);it.notes=o?(o.notes||[]):[];it.media=(it.media||[]).map(m=>{const om=o&&(o.media||[]).find(x=>x.id===m.id);return {...m,notes:om?(om.notes||[]):[]}});return it})}
  save();return cur},
 async fetchBlobs(map){for(const id in (map||{})){if(await IDB.get('blobs',id))continue;try{const r=await fetch(map[id]);if(!r.ok)continue;const b=await r.blob();await IDB.put('blobs',id,b)}catch(e){console.warn('blob',id,e.message)}}},
 async ensureBlobs(items,quiet){const ids=SYNC.blobIds(items);let have={};if(ids.length){have=(await api('/blobs?team='+S.team.id+'&ids='+ids.join(','))).blobs}
  const todo=ids.filter(id=>!have[id]);let k=0;
  for(const id of todo){k++;if(!quiet)toast(`파일 올리는 중 ${k}/${todo.length}…`);const b=await IDB.get('blobs',id);if(!b)throw new Error('이 기기에 없는 파일이 있어요');
   await uploadBlob(id,b,quiet?null:p=>{if(p<100)toast(`파일 올리는 중 ${k}/${todo.length} · ${p}%`)})}},
 // 파일 복구(인도자): 이 팀의 콘티가 참조하는 파일을 이 기기의 저장소에서 강제로 다시 올린다 — 스토어에서 파일이 사라졌을 때 팀원들 화면을 살리는 용도
 async repairBlobs(){if(!online()||!isLeader()||!S.team.id)return {ok:0,miss:0};const ids=new Set();S.services.forEach(s=>{SYNC.blobIds(s.items).forEach(id=>ids.add(id));if(s.published)SYNC.blobIds(s.published.items).forEach(id=>ids.add(id))});
  let ok=0,miss=0,k=0;for(const id of ids){k++;toast(`파일 올리는 중 ${k}/${ids.size}…`);const b=await IDB.get('blobs',id);if(!b){miss++;continue}
   try{await uploadBlob(id,b,null,true);ok++}catch(e){miss++}}
  return {ok,miss}},
 // 초안(인도자): 기기 간 이어서 편집
 draftDoc(svc){return {id:svc.id,name:svc.name,date:svc.date,notice:svc.notice||'',message:svc.message||'',messageRev:svc.messageRev||0,word:svc.word||null,version:svc.version||0,editedAt:svc.editedAt||0,items:clone(svc.items).map(it=>({...it,notes:undefined,media:(it.media||[]).map(m=>({...m,notes:undefined}))}))}},
 async pushDraft(svc){if(!online()||!isLeader()||!svc||!svc.editedAt)return;if(svc.draftPushedAt===svc.editedAt)return;try{await SYNC.ensureBlobs(svc.items,true);await api('/services/'+svc.id+'/draft',{method:'PUT',body:{teamId:S.team.id,doc:SYNC.draftDoc(svc)}});svc.draftPushedAt=svc.editedAt;save()}catch(e){console.warn('draft push',e.message)}},
 applyDraft(svc,doc){scrubIds(doc);const old=new Map(svc.items.map(it=>[it.id,it]));if(doc.word&&!svc.word)svc.word=doc.word;svc.name=doc.name;svc.date=doc.date;svc.notice=doc.notice||'';svc.message=doc.message||'';svc.messageRev=doc.messageRev||0;svc.version=Math.max(svc.version||0,doc.version||0);svc.editedAt=doc.editedAt||Date.now();svc.draftPushedAt=svc.editedAt;
  svc.items=clone(doc.items).map(it=>{const o=old.get(it.id);it.notes=o?(o.notes||[]):[];it.media=(it.media||[]).map(m=>{const om=o&&(o.media||[]).find(x=>x.id===m.id);return {...m,notes:om?(om.notes||[]):[]}});return it});save()},
 async pullDraft(svc){if(!online()||!isLeader()||!svc)return false;let d;try{d=await api('/services/'+svc.id+'/draft?team='+S.team.id)}catch(e){return false}
  if(!d||!d.doc)return false;const remote=+d.doc.editedAt||0;if(remote<=(svc.editedAt||0)+500)return false;
  const when=new Date(remote).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});
  if(!confirm(`다른 기기에서 ${when}에 저장한 초안이 더 새로워요. 가져올까요?\n(취소하면 이 기기의 초안을 유지하고, 다음 저장 때 서버에 덮어씁니다)`)){svc.editedAt=Date.now();save();return false}
  await SYNC.fetchBlobs(d.blobs);SYNC.applyDraft(svc,d.doc);toast('다른 기기의 초안을 가져왔어요');return true},
 // 발행(인도자): 새 파일 업로드 → 스냅샷 저장
 async pushPublish(svc){if(!online()||!isLeader())return false;const pub=svc.published;await SYNC.ensureBlobs(pub.items);
  await api('/services/'+svc.id,{method:'PUT',body:{teamId:S.team.id,doc:{id:svc.id,name:pub.name,date:pub.date,notice:pub.notice,message:pub.message||'',messageRev:pub.messageRev||0,word:svc.word||null,author:pub.author||'',version:pub.version,items:pub.items}}});return true},
 async deleteService(id){if(!online()||!isLeader())return;try{await api('/services/'+id+'?team='+S.team.id,{method:'DELETE'})}catch(e){toast(e.message)}},
 // 메모: 로컬 ↔ 서버 차이만 올림 (실패하면 다음 저장 때 다시)
 localNotes(svc){const out=[];svc.items.forEach(it=>{(it.notes||[]).forEach(n=>out.push({...n,itemId:it.id,markerId:n.marker||null,mediaId:null}));(it.media||[]).forEach(m=>(m.notes||[]).forEach(n=>out.push({...n,itemId:it.id,markerId:n.marker||null,mediaId:m.id})))});return out},
 shadow(id){S.noteShadow=S.noteShadow||{};return S.noteShadow[id]||(S.noteShadow[id]=[])},
 async pushNotes(svc,keep){if(!online()||!svc||!S.team.id)return;const sh=SYNC.shadow(svc.id);const local=SYNC.localNotes(svc);const localIds=[...new Set(local.map(n=>n.id))];const shSet=new Set(sh);
  const add=local.filter(n=>!shSet.has(n.id));const del=sh.filter(id=>!localIds.includes(id));if(!add.length&&!del.length)return;
  try{if(add.length)await api('/notes',{method:'POST',keepalive:!!keep,body:{teamId:S.team.id,serviceId:svc.id,notes:add.map(n=>({id:n.id,itemId:n.itemId,markerId:n.markerId,mediaId:n.mediaId,t:n.t,layer:n.layer,session:n.session,text:n.text,at:n.at}))}});
   if(del.length)await api('/notes',{method:'DELETE',keepalive:!!keep,body:{teamId:S.team.id,ids:del}});

/* ---------- song form parser ---------- */
function parseForm(str){
 const out=[];if(!str)return out;
 const segs=str.split(/\s+[–\-—]\s+|\s*–\s*/).map(s=>s.trim()).filter(Boolean);
 const FLOW=['멘트','1414','다음 곡','다음곡','rit.','rit','반복','Brk','브레이크'];
 for(const seg of segs){
  let i=0;const toks=[];
  while(i<seg.length){
   const rest=seg.slice(i);
   let m;
   if(rest[0]==='('){ // balanced paren
    let d=0,j=0;for(;j<rest.length;j++){if(rest[j]==='(')d++;else if(rest[j]===')'){d--;if(d===0)break}}
    const inner=rest.slice(1,j);i+=j+1;
    if(/^(full|down|key ?up|key ?down|brk|break|soft|loud|half)/i.test(inner))toks.push({t:'mod',v:inner});
    else toks.push({t:'part',v:inner});continue}
   if((m=rest.match(/^(Intro|Int|Outro|Inter|Bridge|Ending|Tag)\s*(\((?:[^()]|\([^()]*\))*\))?/i))){let v=m[1];if(m[2]){let x=m[2].slice(1,-1);v+=' '+x.replace(/\((.*)\)/,' · $1')}toks.push({t:'part',v});i+=m[0].length;continue}
   if((m=rest.match(/^(다음 ?곡|멘트|1414|rit\.?|반복)/))){toks.push({t:'flow',v:m[1].replace('다음곡','다음 곡')});i+=m[0].length;continue}
   if((m=rest.match(/^([A-Ha-h])(\d?)(['’]?)/))){toks.push({t:'sec',v:m[1].toUpperCase()+m[2]+(m[3]?"'":'')});i+=m[0].length;continue}
   if((m=rest.match(/^[\s,·]+/))){i+=m[0].length;continue}
   // unknown run
   m=rest.match(/^[^A-Ha-h(\s]+/)||rest.match(/^./);toks.push({t:'etc',v:m[0]});i+=m[0].length;
  }
  out.push(...toks);
 }
 return out;
}
function chipsHTML(str,cls){return parseForm(str).map(t=>`<span class="chip ${t.t==='sec'?'s':t.t==='mod'?'mod':t.t==='etc'?'x':''} ${cls||''}">${esc(t.v)}</span>`).join('')}
function modsFor(str){const toks=parseForm(str),map={};let pending=[];for(const t of toks){if(t.t==='mod'){pending.push(t.v);continue}if(t.t==='sec'){const base=t.v.replace(/\d+/g,'');if(pending.length){if(!map[t.v])map[t.v]=pending.join(' · ');if(!map[base])map[base]=pending.join(' · ')+(t.v!==base?' ('+t.v+')':'')}pending=[];continue}if(t.t!=='flow')pending=[]}return map}

/* ---------- image import + gap detection ---------- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function importImage(file){
 const src=URL.createObjectURL(file);const im=await loadImg(src);
 const maxW=1400,s=Math.min(1,maxW/im.naturalWidth);let w=Math.round(im.naturalWidth*s),h=Math.round(im.naturalHeight*s);
 let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);
 const info=analyze(c);
 if(info.photo){c=flatten(c,info)}                       // 명암 정리 (그림자·회색 배경 → 흰 배경)
 if(Math.abs(info.angle)>=0.3){c=rotateCanvas(c,-info.angle)} // 기울기 보정
 const box=inkBox(c);if(box){c=cropCanvas(c,box)}         // 여백 잘라내기
 w=c.width;h=c.height;
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
 const gaps=detectGaps(c);URL.revokeObjectURL(src);
 return {blob,w,h,gaps,fix:{angle:info.angle,photo:info.photo,trimmed:!!box}};
}
function grayOf(canvas,W){const H=Math.round(canvas.height*W/canvas.width);const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(canvas,0,0,W,H);const d=x.getImageData(0,0,W,H).data;const g=new Uint8Array(W*H);for(let i=0,p=0;i<d.length;i+=4,p++)g[p]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;return {g,W,H}}
function analyze(canvas){
 const {g,W,H}=grayOf(canvas,320);const hist=new Uint32Array(256);for(let i=0;i<g.length;i++)hist[g[i]]++;
 let bg=255,mx=0;for(let v=100;v<256;v++)if(hist[v]>mx){mx=hist[v];bg=v}
 const thr=bg-Math.max(50,bg*0.3);
 // skew: score = variance of row ink counts after shearing by angle
 function score(a){const t=Math.tan(a*Math.PI/180);const rows=new Float32Array(H);for(let y=0;y<H;y++)for(let x=0;x<W;x+=2){const yy=Math.round(y+(x-W/2)*t);if(yy<0||yy>=H)continue;if(g[yy*W+x]<thr)rows[y]++}let m=0;for(let y=0;y<H;y++)m+=rows[y];m/=H;let v=0;for(let y=0;y<H;y++)v+=(rows[y]-m)*(rows[y]-m);return v}
 let best=0,bs=score(0);for(let a=-3;a<=3;a+=0.25){if(a===0)continue;const sc=score(a);if(sc>bs*1.02){bs=sc;best=a}}
 return {angle:best,bg,photo:bg<225}
}
function flatten(canvas,info){const w=canvas.width,h=canvas.height;const bgc=document.createElement('canvas');const sw=Math.max(8,Math.round(w/40)),shh=Math.max(8,Math.round(h/40));bgc.width=sw;bgc.height=shh;const bx=bgc.getContext('2d');bx.filter='blur(2px)';bx.drawImage(canvas,0,0,sw,shh);const bd=bx.getImageData(0,0,sw,shh).data;
 const x=canvas.getContext('2d');const img=x.getImageData(0,0,w,h);const d=img.data;
 for(let y=0;y<h;y++){const by=Math.min(shh-1,(y*shh/h)|0);for(let xx=0;xx<w;xx++){const bxi=Math.min(sw-1,(xx*sw/w)|0);const bi=(by*sw+bxi)*4;const bgv=Math.max(40,(bd[bi]*299+bd[bi+1]*587+bd[bi+2]*114)/1000);const i=(y*w+xx)*4;const gv=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;let v=gv/bgv*255;v=(v-120)*1.6+120;v=v<0?0:v>255?255:v;d[i]=d[i+1]=d[i+2]=v}}
 x.putImageData(img,0,0);return canvas}
function rotateCanvas(canvas,deg){const r=deg*Math.PI/180;const w=canvas.width,h=canvas.height;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.translate(w/2,h/2);x.rotate(r);x.drawImage(canvas,-w/2,-h/2);return c}
function inkBox(canvas){const {g,W,H}=grayOf(canvas,400);const hist=new Uint32Array(256);for(let i=0;i<g.length;i++)hist[g[i]]++;let bg=255,mx=0;for(let v=100;v<256;v++)if(hist[v]>mx){mx=hist[v];bg=v}const thr=bg-Math.max(50,bg*0.3);
 let top=-1,bot=-1,left=W,right=-1;for(let y=0;y<H;y++){let n=0;for(let x=0;x<W;x++)if(g[y*W+x]<thr){n++;if(x<left)left=x;if(x>right)right=x}if(n>=2){if(top<0)top=y;bot=y}}
 if(top<0||right<left)return null;const k=canvas.width/W;const pad=Math.round(14*k/ (canvas.width/400)*0.5+12);
 const bx={x:Math.max(0,Math.round(left*k)-pad),y:Math.max(0,Math.round(top*k)-pad),w:0,h:0};bx.w=Math.min(canvas.width,Math.round((right+1)*k)+pad)-bx.x;bx.h=Math.min(canvas.height,Math.round((bot+1)*k)+pad)-bx.y;
 if(bx.w<canvas.width*0.3||bx.h<canvas.height*0.3)return null;if(bx.w>canvas.width-8&&bx.h>canvas.height-8)return null;return bx}
function cropCanvas(canvas,b){const c=document.createElement('canvas');c.width=b.w;c.height=b.h;c.getContext('2d').drawImage(canvas,b.x,b.y,b.w,b.h,0,0,b.w,b.h);return c}
function detectGaps(canvas){
 const W=Math.min(600,canvas.width),H=Math.round(canvas.height*W/canvas.width);
 const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.drawImage(canvas,0,0,W,H);
 const d=ctx.getImageData(0,0,W,H).data;const g=new Uint8Array(W*H);const hist=new Uint32Array(256);
 for(let i=0,p=0;i<d.length;i+=4,p++){const v=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;g[p]=v;hist[v]++}
 let bg=255,mx=0;for(let v=120;v<256;v++)if(hist[v]>mx){mx=hist[v];bg=v}
 const thr=bg-Math.max(60,bg*0.35);
 const ratio=new Float32Array(H);for(let y=0;y<H;y++){let n=0;for(let x=0;x<W;x++)if(g[y*W+x]<thr)n++;ratio[y]=n/W}
 const minLen=Math.max(4,Math.round(H/150));const gaps=[];let y=0;
 while(y<H){if(ratio[y]<0.004){const s0=y;while(y<H&&ratio[y]<0.004)y++;if(y-s0>=minLen)gaps.push({s:s0,e:y})}else y++}
 const k=canvas.height/H;return gaps.map(q=>({s:Math.round(q.s*k),e:Math.round(q.e*k)}));
}
function autoCut(piece,y){let best=null;for(const q of (piece.gaps||[])){if(q.e<=y+4&&(best===null||q.e>best.e))best=q}if(!best)return null;return Math.round((best.s+best.e)/2)}


/* ---------- 코드 인식 · 전조 병기 ---------- */
const NOTE_SEMI={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,'E#':5,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11,'B#':0};
const SHARP_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FLAT_NAMES=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FLAT_KEYS=['F','Bb','Eb','Ab','Db','Gb','Cb','Dm','Gm','Cm','Fm','Bbm','Ebm','Abm'];
const KEYS12=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const normAcc=t=>String(t||'').replace(/♯/g,'#').replace(/♭/g,'b').replace(/[，,．.:;]+$/,'').trim();
const CHORD_RE=/^([A-G])(#|b)?((?:maj|min|dim|aug|sus|add|m|M|\+|°|º|o|ø|-|\d|\(|\))*)(?:\/([A-G])(#|b)?)?$/;
function parseChord(t){const m=normAcc(t).match(CHORD_RE);if(!m)return null;return {root:m[1]+(m[2]||''),suffix:m[3]||'',bass:m[4]?m[4]+(m[5]||''):null}}
const isChordText=t=>{t=normAcc(t);const c=parseChord(t);return !!c&&!/^[A-G]\d{2,}$/.test(t)&&t.length<=12};
function keySemi(k){const m=normAcc(k).match(/^([A-G])(#|b)?/);if(!m)return null;const v=NOTE_SEMI[m[1]+(m[2]||'')];return v==null?null:v}
function spell(semi,key){const k=normAcc(key).replace(/\s/g,'');const flat=FLAT_KEYS.includes(k)||FLAT_KEYS.includes(k.replace(/m(in)?$/,''))||/^[A-G]b/.test(k);return (flat?FLAT_NAMES:SHARP_NAMES)[((semi%12)+12)%12]}
function transposeChord(text,semis,key){const c=parseChord(text);if(!c)return text;const r=NOTE_SEMI[c.root];if(r==null)return text;let out=spell(r+semis,key)+c.suffix;if(c.bass){const b=NOTE_SEMI[c.bass];out+='/'+(b==null?c.bass:spell(b+semis,key))}return out}
function shiftAt(item,pi,y){let best=null;(item.pieces||[]).forEach((p,i)=>{if(i>pi)return;(p.markers||[]).forEach(m=>{if(m.keyShift==null)return;if(i<pi||m.y<=y){if(!best||i>best.i||(i===best.i&&m.y>best.y))best={i,y:m.y,v:m.keyShift}}})});return best?best.v:0}
function chordOffset(item,piece){if(!piece)return 0;if(piece.offset!=null)return piece.offset;const a=keySemi(item.key),b=keySemi(piece.sheetKey);if(a==null||b==null)return 0;let d=a-b;while(d>6)d-=12;while(d<-6)d+=12;return d}
function estimateKey(chords){const roots=(chords||[]).map(c=>parseChord(c.text)).filter(Boolean).map(c=>c.root);if(!roots.length)return '';const cnt={};roots.forEach(r=>cnt[r]=(cnt[r]||0)+1);const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);const last=roots[roots.length-1];return top.slice(0,2).includes(last)?last:top[0]}
// 오선 위치: 폭의 40% 이상 이어지는 어두운 행 → 선 → 4줄 이상 묶음이 시스템
// 오선 검출: 얇은 세로 런(선 두께)만 남긴 마스크를 8개 세로 띠로 나눠 행별 덮임률로 선을 찾고, 등간격 4줄 이상을 시스템으로.
// 띠 단위라 기울기·두 장 나란히 스캔·부분 오선도 잡히고, 시스템마다 가로 범위(x0~x1)를 돌려준다.
function detectSystems(canvas){const W=Math.min(1600,canvas.width);const H=Math.round(canvas.height*W/canvas.width);const c=document.createElement('canvas');c.width=W;c.height=H;const x2=c.getContext('2d');x2.drawImage(canvas,0,0,W,H);const d=x2.getImageData(0,0,W,H).data;const g=new Uint8Array(W*H);const hist=new Uint32Array(256);for(let i=0,p=0;i<d.length;i+=4,p++){g[p]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;hist[g[p]]++}
 let bg=255,mx=0;for(let v=120;v<256;v++)if(hist[v]>mx){mx=hist[v];bg=v}const thr=bg-Math.max(30,bg*0.2);
 const maxT=Math.max(3,Math.round(H/300));const thin=new Uint8Array(W*H);
 for(let x=0;x<W;x++){let y=0;while(y<H){if(g[y*W+x]<thr){const s0=y;while(y<H&&g[y*W+x]<thr)y++;if(y-s0<=maxT)for(let k=s0;k<y;k++)thin[k*W+x]=1}else y++}}
 const nS=8,sw=Math.floor(W/nS);const found=[];
 for(let si=0;si<nS;si++){const x0=si*sw,x1=si===nS-1?W:x0+sw;const rows=[];
  for(let y=0;y<H;y++){let n=0;for(let x=x0;x<x1;x++)if(thin[y*W+x])n++;if(n>=(x1-x0)*0.3)rows.push(y)}
  const lines=[];rows.forEach(y=>{const L=lines[lines.length-1];if(L&&y-L.e<=1)L.e=y;else lines.push({s:y,e:y})});
  if(lines.length<4)continue;const dist=[];for(let i=1;i<lines.length;i++)dist.push(lines[i].s-lines[i-1].e);dist.sort((a,b)=>a-b);const med=dist[Math.floor(dist.length/2)];const tol=Math.max(med*1.8,4);
  let grp=[];const flush=()=>{if(grp.length>=4)found.push({top:grp[0].s,bottom:grp[grp.length-1].e,sp:med,x0,x1,si});grp=[]};
  lines.forEach(l=>{if(grp.length&&l.s-grp[grp.length-1].e>tol)flush();grp.push(l)});flush()}
 found.sort((a,b)=>a.si-b.si||a.top-b.top);const out=[];
 found.forEach(f=>{const o=out.find(o=>o.siEnd===f.si-1&&Math.abs(o.top-f.top)<=Math.max(o.sp,f.sp)*1.2+2&&Math.abs(o.bottom-f.bottom)<=Math.max(o.sp,f.sp)*1.2+2);
  if(o){o.top=Math.min(o.top,f.top);o.bottom=Math.max(o.bottom,f.bottom);o.x1=f.x1;o.siEnd=f.si;o.sp=Math.max(o.sp,f.sp)}else out.push({top:f.top,bottom:f.bottom,x0:f.x0,x1:f.x1,sp:f.sp,siEnd:f.si})});
 const k=canvas.height/H;return out.filter(o=>o.x1-o.x0>=sw*2).sort((a,b)=>a.top-b.top||a.x0-b.x0).map(o=>({top:Math.round(o.top*k),bottom:Math.round(o.bottom*k),x0:Math.round(Math.max(0,o.x0-sw)*k),x1:Math.round(Math.min(W,o.x1+sw)*k)}))}

async function recognizeChords(svc,it,piece){if(!online()||!isLeader()||!piece)return;piece.ocr='pending';piece.ocrErr='';save();if(route().name==='edit')drawEditorSheet(svc);
 try{const blob=await IDB.get('blobs',piece.blob);if(!blob)throw new Error('이 기기에 악보 파일이 없어요');const img=await loadImg(URL.createObjectURL(blob));
  const cv=document.createElement('canvas');cv.width=img.naturalWidth;cv.height=img.naturalHeight;cv.getContext('2d').drawImage(img,0,0);
  let sys=[];try{sys=detectSystems(cv)}catch(e){console.warn('detectSystems',e)}let mode=sys.length?'bands':'tiles';
  const H=cv.height,W=cv.width;const bands=[];
  sys.forEach((s0,i)=>{const above=sys.filter((o,j)=>j<i&&o.x1>s0.x0&&o.x0<s0.x1);const prevB=above.length?Math.max(...above.map(o=>o.bottom)):0;const top=Math.max(prevB+Math.round(H*0.008),s0.top-Math.round(H*0.055));const bot=s0.top-1;if(bot-top>=8)bands.push({top,bot,x0:s0.x0,x1:s0.x1})});
  if(!bands.length){mode='tiles'}

  const titleBot=sys.length?Math.max(40,Math.min(...sys.map(o=>o.top))-2):Math.round(H*0.18);
  const scale=W<1600?2:1;const mk=(b,kind)=>{const bw=b.x1-b.x0;const c=document.createElement('canvas');c.width=bw*scale;c.height=(b.bot-b.top)*scale;c.getContext('2d').drawImage(cv,b.x0,b.top,bw,b.bot-b.top,0,0,c.width,c.height);return {b64:c.toDataURL('image/jpeg',0.85).split(',')[1],mime:'image/jpeg',w:c.width,h:c.height,top:b.top,left:b.x0,kind}};
  const titleImg=titleBot>12?mk({top:0,bot:titleBot,x0:0,x1:W},'title'):null;
  const images=bands.slice(0,32).map(b=>{const bw=b.x1-b.x0;const c=document.createElement('canvas');c.width=bw*scale;c.height=(b.bot-b.top)*scale;c.getContext('2d').drawImage(cv,b.x0,b.top,bw,b.bot-b.top,0,0,c.width,c.height);return {b64:c.toDataURL('image/jpeg',0.85).split(',')[1],mime:'image/jpeg',w:c.width,h:c.height,top:b.top,left:b.x0}});
  const all=images.concat(titleImg?[titleImg]:[]);const results=[];for(let k0=0;k0<all.length;k0+=16){const part=all.slice(k0,k0+16);const r=await api('/ocr',{method:'POST',body:{teamId:S.team.id,images:part.map(({b64,mime,w,h,kind})=>({b64,mime,w,h,kind}))}});results.push(...(r.results||[]))}
  const titleRes=titleImg?results.pop():null;

  // 겹치는 타일에서 같은 코드가 두 번 잡힌 것 제거
  const uniq=[];found.sort((a,b)=>a.y-b.y||a.x-b.x).forEach(c=>{if(!uniq.some(u=>u.text===c.text&&Math.abs(u.x-c.x)<c.h&&Math.abs(u.y-c.y)<c.h))uniq.push(c)});

// 제목 추정: 상단 띠의 토큰을 줄로 묶고, 글자 높이가 가장 큰 줄(메타 정보 제외)
function guessTitle(tokens){const bad=/작사|작곡|채보|편곡|Words|Music|Arranged|Lyrics|Public Domain|=\s*\d+|♩|^[\d\s+\-.,:]+$/;
 const lines=[];tokens.slice().sort((a,b)=>a.y-b.y||a.x-b.x).forEach(t=>{const L=lines.find(l=>Math.abs(l.y-t.y)<Math.max(l.h,t.h)*0.6);if(L){L.toks.push(t);L.h=Math.max(L.h,t.h)}else lines.push({y:t.y,h:t.h,toks:[t]})});
 const cands=lines.map(l=>{let toks=l.toks.sort((a,b)=>a.x-b.x);const hs=toks.map(t=>t.h).sort((a,b)=>a-b);const medH=hs[Math.floor(hs.length/2)]||l.h;const span=toks.length?(toks[toks.length-1].x+toks[toks.length-1].w-toks[0].x):0;const gapMin=Math.max(medH*2.5,span*0.12);const seg=[];toks.forEach(t=>{const prev=seg.length?seg[seg.length-1]:null;if(prev&&t.x-(prev.x+prev.w)>gapMin)seg.push(null);seg.push(t)});const cut=seg.indexOf(null);if(cut>0)toks=seg.slice(0,cut); // 두 장 나란히: 왼쪽 제목만
  const words=toks.map(t=>t.text.trim()).filter(Boolean);const chordy=words.filter(w=>isChordText(w)).length;return {text:words.join(' ').replace(/\s+/g,' '),h:l.h,x:toks.length?toks[0].x:0,words:words.length,chordy}})
  .filter(c=>c.words&&c.chordy/c.words<0.5&&!bad.test(c.text)&&/[가-힣]{2,}|[A-Za-z]{3,}/.test(c.text)&&c.text.replace(/[^가-힣A-Za-z]/g,'').length>=2);
 if(!cands.length)return '';const maxH=Math.max(...cands.map(c=>c.h));const big=cands.filter(c=>c.h>=maxH*0.8).sort((a,b)=>a.x-b.x);return big[0].text.slice(0,60)}

function sheetHTML(item,W,ctx){
